      S.questions.push(o); return o.id; });
    S.sets.push({id:uid(),name,subject,kind:"prebuilt",path,createdAt:Date.now(),questionIds:ids});
  };
  Object.keys(CONJ).forEach(lang=>{
    const P=PERSONS[lang], table=CONJ[lang];
    const verbs=Object.keys(table);

    /* every verb x every person, both directions */
    const forward=[], backward=[], mixed=[];
    verbs.forEach(v=>{
      const forms=table[v], short=v.split(" ")[0], eng=v.match(/\((.*)\)/)[1];
      forms.forEach((f,pi)=>{
        forward.push([`${short}: ${P[pi][0]} ___`, f, f]);
        backward.push([`Which person goes with "${f}" from ${short}?`, P[pi][0]]);
        mixed.push([`Say "${P[pi][1]}" with ${eng.replace("to ","")}: ${P[pi][0]} ___`, f, f]);
      });
    });
    add("All verbs, every person", lang, ["Grammar","Verbs","Deep practice"], forward);
    add("Spot the person", lang, ["Grammar","Verbs","Deep practice"], backward);
    add("Meaning to form", lang, ["Grammar","Verbs","Deep practice"], mixed);

    /* one focused set per verb */
    verbs.forEach(v=>{
      const forms=table[v], short=v.split(" ")[0];
      const cards=[];
      forms.forEach((f,pi)=>{
        cards.push([`${short}: ${P[pi][0]} ___`, f, f]);
        cards.push([`Which form of ${short} goes with ${P[pi][0]}?`, f, f]);
      });
      add(v, lang, ["Grammar","Verbs","One verb at a time"], cards);
    });

    /* gender and articles */
    const gn=GENDER_NOUNS[lang]||[];
    if(gn.length){
      const arts=[...new Set(gn.map(g=>g[1]))].join(", ");
      const g1=gn.map(g=>[`Which article goes with ${g[0]}? (${arts})`, g[1], g[1]+" "+g[0]]);
      const g2=gn.map(g=>[`Write ${g[1]} ${g[0]} and say what the article tells you`, g[1]+" "+g[0], g[1]+" "+g[0]]);
      add("Articles and gender", lang, ["Grammar","Nouns","Deep practice"], g1.concat(g2));
    }
  });

  /* English grammar drills */
  const IRREG=[["run","ran"],["go","went"],["eat","ate"],["see","saw"],["take","took"],["give","gave"],["come","came"],
    ["write","wrote"],["speak","spoke"],["break","broke"],["choose","chose"],["drive","drove"],["fall","fell"],
    ["feel","felt"],["find","found"],["fly","flew"],["forget","forgot"],["get","got"],["know","knew"],["leave","left"],
    ["make","made"],["meet","met"],["pay","paid"],["read","read"],["ride","rode"],["sing","sang"],["sit","sat"],
    ["sleep","slept"],["swim","swam"],["teach","taught"],["tell","told"],["think","thought"],["wear","wore"],["win","won"]];
  const PLURALS=[["child","children"],["mouse","mice"],["foot","feet"],["tooth","teeth"],["person","people"],
    ["goose","geese"],["man","men"],["woman","women"],["leaf","leaves"],["knife","knives"],["life","lives"],
    ["shelf","shelves"],["baby","babies"],["city","cities"],["party","parties"],["box","boxes"],["bus","buses"],
    ["dish","dishes"],["church","churches"],["sheep","sheep"],["deer","deer"],["fish","fish"]];
  const eng1=IRREG.map(v=>[`What is the past tense of "${v[0]}"?`, v[1]]);
  const eng2=IRREG.map(v=>[`"${v[1]}" is the past tense of which verb?`, v[0]]);
  const eng3=PLURALS.map(p=>[`What is the plural of "${p[0]}"?`, p[1]]);
  const eng4=PLURALS.map(p=>[`"${p[1]}" is the plural of which word?`, p[0]]);
  const addE=(name,path,cards)=>{
    const ids=cards.map(c=>{ const o=newQuestion(c[0],c[1],"English","prebuilt"); S.questions.push(o); return o.id; });
    S.sets.push({id:uid(),name,subject:"English",kind:"prebuilt",path,createdAt:Date.now(),questionIds:ids});
  };
  addE("Irregular past tense", ["Grammar","Tenses","Deep practice"], eng1.concat(eng2));
  addE("Tricky plurals", ["Grammar","Plurals","Deep practice"], eng3.concat(eng4));
}

/* many questions name their own choices, e.g. "living or non-living".
   Using those makes a far better wrong answer than a word from another topic. */
function promptChoices(p, answer){
  const s=String(p||"");
  const m = s.match(/\(([^)]*\bor\b[^)]*)\)/i) || s.match(/([A-Za-zÀ-ÿ'-]+(?:,\s*[A-Za-zÀ-ÿ'-]+)*\s+or\s+[A-Za-zÀ-ÿ'-]+)/i);
  if(!m) return [];
  const seg=(m[1]||"").replace(/[?.]$/,"");
  const low=x=>String(x).trim().toLowerCase();
  const strip=x=>String(x).trim().replace(/^['"\u2018\u2019\u201c\u201d]+|['"\u2018\u2019\u201c\u201d]+$/g,"")
                 .replace(/^(a|an|the)\s+/i,"").replace(/[?.]$/,"").trim();
  const out=[];
  seg.split(/,|\bor\b/i).forEach(x=>{
    const v=strip(x);
    if(v.length>1 && low(v)!==low(strip(answer)) && !out.some(o=>low(o)===low(v))) out.push(v);
  });
  return out;
}

/* choose wrong answers that are actually tempting: same topic wording, same shape */
function pickDistractors(q, qs, need, seed){
  const low=x=>String(x||"").trim().toLowerCase();
  const a=low(q.answer);
  const named=promptChoices(q.prompt, q.answer);
  if(named.length>=need) return seededPick(named, need, seed);
  const isNum=s=>/^-?[\d.,/ ]+$/.test(String(s).trim());
  const words=s=>new Set((String(s).toLowerCase().match(/[a-z]{4,}/g)||[]));
  const qw=words(q.prompt);
  const BOOL=new Set(["true","false","yes","no"]);
  const scored=qs.filter(x=>x.id!==q.id && x.answer && low(x.answer)!==a && x.answer.length<=30
                            && !(BOOL.has(low(x.answer)) !== BOOL.has(a)))
    .map(x=>{
      let s=0;
      const xw=words(x.prompt);
      qw.forEach(w=>{ if(xw.has(w)) s+=3; });                          // asks about the same thing
      if(isNum(x.answer)===isNum(q.answer)) s+=2;                      // both numbers or both words
      if(Math.abs(x.answer.length-String(q.answer).length)<=4) s+=1;   // similar length
      return {v:x.answer, s};
    })
    .sort((p,r)=>r.s-p.s);
  if(!scored.length) return [];
  const cut=Math.max(1, scored[0].s-2);
  const strong=[...new Set(scored.filter(o=>o.s>=cut).map(o=>o.v))];
  const pool=[...named, ...strong];
  if(pool.length>=need) return seededPick([...new Set(pool)], need, seed);
  const rest=[...new Set(scored.map(o=>o.v))].filter(v=>!pool.includes(v));
  return [...new Set([...pool, ...seededPick(rest, need-pool.length, seed)])].slice(0,need);
}

/* ---- join small sets together so nothing is left with a handful of questions ---- */
function consolidateSets(){
  const MIN=12;
  const key=s=>s.subject+"||"+(s.path||[]).join("/");
  const groups={};
  S.sets.filter(s=>s.kind==="prebuilt"&&!s.uc).forEach(s=>{ (groups[key(s)]=groups[key(s)]||[]).push(s); });

  Object.values(groups).forEach(list=>{
    if(list.length<2) return;
    list.sort((a,b)=>a.questionIds.length-b.questionIds.length);
    for(let i=0;i<list.length;i++){
      const s=list[i];
      if(!s || s._gone || s.questionIds.length>=MIN) continue;
      /* pull in the next smallest sibling until it is big enough */
      for(let j=i+1;j<list.length && s.questionIds.length<MIN;j++){
        const t=list[j];
        if(!t || t._gone) continue;
        s.questionIds = [...new Set([...s.questionIds, ...t.questionIds])];
        s.name = mergedName(s, t);
        t._gone = true;
      }
    }
  });

  /* anything still short borrows from a sibling in the same subject */
  const bySubject={};
  S.sets.filter(s=>s.kind==="prebuilt"&&!s.uc&&!s._gone).forEach(s=>{ (bySubject[s.subject]=bySubject[s.subject]||[]).push(s); });
  Object.values(bySubject).forEach(list=>{
    list.filter(s=>s.questionIds.length<MIN).forEach(s=>{
      const donors=list.filter(d=>d!==s && !d._gone && d.questionIds.length>MIN+6);
      for(const d of donors){
        if(s.questionIds.length>=MIN) break;
        const spare=d.questionIds.filter(id=>!s.questionIds.includes(id)).slice(0, MIN-s.questionIds.length);
        s.questionIds=[...s.questionIds, ...spare];   /* shared, not moved, so the donor keeps its size */
      }
    });
  });

  S.sets = S.sets.filter(s=>!s._gone);
}
function mergedName(a,b){
  if(a.name===b.name) return a.name;
  const nums=[a.name,b.name].map(n=>(n.match(/\d+/)||[])[0]).filter(Boolean);
  if(nums.length===2) return a.name.replace(/\d+/, Math.min(...nums.map(Number))+" to "+Math.max(...nums.map(Number)));
  return a.name+" and "+b.name.replace(/^(Year \d+|Easy|Hard)\s*/,"");
}

/* ---- choose several, and matching, built straight from the structured lists ---- */
function buildSelectAndMatch(){
  const addSet=(name,subject,path,items)=>{
    if(items.length<6) return;
    const ids=items.map(it=>{ const o=newQuestion(it.prompt,it.answer,subject,"prebuilt");
      Object.assign(o,it.extra); S.questions.push(o); return o.id; });
    S.sets.push({id:uid(),name,subject,kind:"prebuilt",path,createdAt:Date.now(),questionIds:ids});
  };
  const pick=(arr,n,seed)=>seededPick(arr,n,seed);

  /* which two of these are ... */
  const multiFrom=(label, pool, keyOf, nameOf, seedBase)=>{
    const groups={};
    pool.forEach(x=>{ const k=keyOf(x); (groups[k]=groups[k]||[]).push(nameOf(x)); });
    const keys=Object.keys(groups).filter(k=>groups[k].length>=2);
    const out=[];
    keys.forEach((k,ki)=>{
      for(let r=0;r<6;r++){
        const right=pick([...new Set(groups[k])],2,seedBase+ki*31+r*7);
        const wrongPool=[...new Set(pool.filter(x=>keyOf(x)!==k).map(nameOf))];
        const wrong=pick(wrongPool,2,seedBase+ki*17+r*13);
        if(right.length<2||wrong.length<2) continue;
        const opts=pick([...right,...wrong],4,seedBase+ki*11+r*3);
        if(new Set(opts).size<4) continue;
        const a=opts.map((o,i)=>right.includes(o)?i:-1).filter(i=>i>=0);
        if(a.length!==2) continue;
        out.push({prompt:"Which two of these are "+label(k)+"?", answer:right.join(" and "),
                  extra:{type:"multi",opts,a}});
      }
    });
    return out;
  };

  const A=SCI.animals;
  let sci=[];
  sci=sci.concat(multiFrom(k=>k+"s", A, a=>a[1], a=>a[0], 101));
  sci=sci.concat(multiFrom(k=>k+"s", A, a=>a[2], a=>a[0], 202));
  sci=sci.concat(multiFrom(k=>"animals that live on "+k, A.filter(a=>a[3]==="land"||a[3]==="ocean"), a=>a[3], a=>a[0], 303));
  sci=sci.concat(multiFrom(k=>k==="1"?"living":"non-living", SCI.living, x=>String(x[1]), x=>x[0], 404));
  sci=sci.concat(multiFrom(k=>k==="1"?"able to conduct electricity":"insulators", SCI.conduct, x=>String(x[1]), x=>x[0], 505));
  sci=sci.concat(multiFrom(k=>k==="1"?"magnetic":"not magnetic", SCI.magnetic, x=>String(x[1]), x=>x[0], 606));
  sci=sci.concat(multiFrom(k=>k+"s at room temperature", SCI.states, x=>x[1], x=>x[0], 707));
  sci=sci.concat(multiFrom(k=>k+"s in a food chain", SCI.foodRole, x=>x[1], x=>x[0], 808));
  addSet("Choose the two", "Science", ["Choose several"], seededPick(sci, 90, 11));

  /* matching: word to meaning, built from the vocabulary themes */
  Object.keys(LANGDATA).forEach(lang=>{
    const D=LANGDATA[lang]; if(D.literacy) return;
    const rows=[];
    D.themes.forEach((th,ti)=>{
      const items=th.items.filter(p=>p[0]&&p[1]);
      for(let r=0;r+4<=items.length && r<12;r+=4){
        const four=items.slice(r,r+4);
        const left=four.map(p=>p[0]), right=four.map(p=>p[1]);
        if(new Set(right).size<4||new Set(left).size<4) continue;
        rows.push({prompt:"Match each word to its "+lang+" translation.",
                   answer:left.map((l,i)=>l+" = "+right[i]).join("; "),
                   extra:{type:"match",mL:left,mR:right}});
      }
    });
    addSet("Match the words", lang, ["Matching"], rows);
    /* choose several: which two mean a colour, an animal and so on */
    const themed=[];
    D.themes.forEach((th,ti)=>{
      const name=(THEME_NAMES[ti]||"this group").toLowerCase();
      const items=th.items.filter(p=>p[1]);
      for(let r=0;r<6;r++){
        const right=seededPick(items.map(p=>p[1]),2,ti*29+r*5+lang.length);
        const other=D.themes.filter((_,j)=>j!==ti).flatMap(t=>t.items.map(p=>p[1]));
        const wrong=seededPick(other,2,ti*13+r*11);
        if(right.length<2||wrong.length<2) continue;
        const opts=seededPick([...right,...wrong],4,ti*7+r*3);
        if(new Set(opts).size<4) continue;
        const a=opts.map((o,i)=>right.includes(o)?i:-1).filter(i=>i>=0);
        if(a.length!==2) continue;
        themed.push({prompt:"Which two of these belong to "+name+"?", answer:right.join(" and "),
                     extra:{type:"multi",opts,a}});
      }
    });
    addSet("Choose the two", lang, ["Choose several"], themed);
  });

  /* maths: which two make the same total */
  const mrows=[];
  for(let t=2;t<=12;t++){
    for(let r=0;r<6;r++){
      const target=t*(4+r);
      const right=[], wrong=[];
      for(let a=2;a<=12;a++){ if(target%a===0 && target/a<=12 && target/a>=2) right.push(a+" × "+(target/a)); }
      for(let a=2;a<=12;a++){ const b=2+((a+r)%9); if(a*b!==target) wrong.push(a+" × "+b); }
      const R=seededPick([...new Set(right)],2,t*31+r), W=seededPick([...new Set(wrong)],2,t*17+r);
      if(R.length<2||W.length<2) continue;
      const opts=seededPick([...R,...W],4,t*7+r);
      if(new Set(opts).size<4) continue;
      const a=opts.map((o,i)=>R.includes(o)?i:-1).filter(i=>i>=0);
      if(a.length!==2) continue;
      mrows.push({prompt:"Which two of these equal "+target+"?", answer:R.join(" and "),
                  extra:{type:"multi",opts,a}});
    }
  }
  addSet("Choose the two", "Maths", ["Choose several"], seededPick(mrows,60,5));

  /* maths: match the calculation to its answer */
  const matchRows=[];
  for(let t=2;t<=12;t++){
    for(let r=0;r<3;r++){
      const four=[]; const seen=new Set();
      for(let k=0;k<4;k++){ const b=2+((t+r+k*3)%11); const val=t*b;
        if(seen.has(val)) continue; seen.add(val); four.push([t+" × "+b, String(val)]); }
      if(four.length<4) continue;
      matchRows.push({prompt:"Match each calculation to its answer.",
                      answer:four.map(f=>f[0]+" = "+f[1]).join("; "),
                      extra:{type:"match",mL:four.map(f=>f[0]),mR:four.map(f=>f[1])}});
    }
  }
  addSet("Match the answers", "Maths", ["Matching"], matchRows);
}

/* ---- give the library sets a real mix of question styles ----
   targets: about 50% typed, 20% multiple choice, 10% true/false,
   10% put in order, 5% matching, 5% choose several                      */
function diversifySets(){
  const norm=x=>String(x||"").trim();
  const low=x=>norm(x).toLowerCase();
  const isNum=s=>/^-?\d+(\.\d+)?$/.test(norm(s));
  const isWord=s=>/^[a-zA-ZÀ-ÿ' -]{2,22}$/.test(norm(s));
  const isEqn=s=>/^[\d\s×÷+−^√²³().,/-]+$/.test(norm(s)) && /[×÷+−]/.test(String(s));
  const done=new Set();

  S.sets.filter(s=>s.kind==="prebuilt" && !s.uc).forEach(set=>{
    const qs=set.questionIds.map(id=>S.questions.find(q=>q.id===id)).filter(Boolean);
    if(qs.length<4) return;
    const h=hashStr(set.id);
    const plain=qs.filter(q=>!q.type && !q.listen && norm(q.answer));
    if(plain.length<4) return;

    /* how many of each style this set should get */
    const n=plain.length;
    const want={ order:Math.round(n*0.10), tf:Math.round(n*0.10),
                 match:Math.max(1,Math.round(n*0.05)), multi:Math.round(n*0.05),
                 mc:Math.round(n*0.20) };

    const numeric=plain.filter(q=>isNum(q.answer));
    const words=plain.filter(q=>isWord(q.answer) && norm(q.answer).length<=20);
    /* answers that appear more than once let us ask "choose the two that are X" */
    const groups={};
    plain.forEach(q=>{ const k=low(q.answer); if(isWord(q.answer)) (groups[k]=groups[k]||[]).push(q); });
    const repeated=Object.entries(groups).filter(([k,v])=>v.length>=2);

    let used=new Set();
    const take=(pool,count,seed)=>{
      const free=pool.filter(q=>!used.has(q.id)&&!done.has(q.id));
      return seededPick(free, count, seed);
    };

    /* ---- put in order: sort calculations by their answer, or words alphabetically ---- */
    let made=0;
    for(let k=0;k<want.order && made<want.order;k++){
      let picks=take(numeric,4,h+k*11+1), byNum=true;
      if(picks.length<4){ picks=take(words,4,h+k*11+2); byNum=false; }
      if(picks.length<4) break;
      const host=picks[0];
      const items=picks.map(q=>byNum?norm(q.prompt):norm(q.answer));
      if(new Set(items).size<4) continue;
      const order=picks.slice().sort((a,b)=> byNum
        ? parseFloat(a.answer)-parseFloat(b.answer)
        : low(a.answer).localeCompare(low(b.answer))
      ).map(q=>byNum?norm(q.prompt):norm(q.answer));
      host.type="order"; host.order=order;
      host.prompt = byNum ? "Put these in order, smallest answer first."
                          : "Put these in alphabetical order.";
      host.answer = order.join(", ");
      picks.forEach(q=>used.add(q.id)); done.add(host.id); made++;
    }

    /* ---- matching: four prompts to their four answers ---- */
    for(let k=0;k<want.match;k++){
      const picks=take(words.length>=4?words:plain,4,h+k*17+3);
      if(picks.length<4) break;
      const left=picks.map(q=>norm(q.prompt)), right=picks.map(q=>norm(q.answer));
      if(new Set(right).size<4 || new Set(left).size<4) break;
      const host=picks[0];
      host.type="match"; host.mL=left; host.mR=right;
      host.prompt="Match each one to its answer.";
      host.answer=left.map((l,i)=>l+" = "+right[i]).join("; ");
      picks.forEach(q=>used.add(q.id)); done.add(host.id);
    }

    /* ---- choose several: two share an answer, two do not ---- */
    for(let k=0;k<want.multi && repeated.length;k++){
      const [key,members]=repeated[(h+k)%repeated.length];
      const right=members.filter(q=>!used.has(q.id)&&!done.has(q.id)).slice(0,2);
      if(right.length<2) break;
      const wrong=plain.filter(q=>low(q.answer)!==key && !used.has(q.id) && !done.has(q.id));
      const others=seededPick(wrong,2,h+k*23);
      if(others.length<2) break;
      const host=right[0];
      const subjects=[...right,...others].map(q=>{
        const m=norm(q.prompt).match(/(?:is|are|does|do)?\s*(?:a|an|the)?\s*([A-Za-zÀ-ÿ' -]{3,24})\b/);
        return m ? m[1].trim() : norm(q.prompt).slice(0,24);
      });
      if(new Set(subjects.map(low)).size<4) break;
      const opts=seededPick(subjects,4,h+k*29);
      const idxs=opts.map((o,i)=>subjects.indexOf(o)<2?i:-1).filter(i=>i>=0);
      if(idxs.length!==2) break;
      host.type="multi"; host.opts=opts; host.a=idxs;
      host.prompt="Which two of these give the answer \""+norm(members[0].answer)+"\"?";
      host.answer=idxs.map(i=>opts[i]).join(" and ");
      [...right,...others].forEach(q=>used.add(q.id)); done.add(host.id);
    }

    /* ---- true or false: a statement that is sometimes wrong ---- */
    /* boolean answers always become a true/false button pair */
    plain.forEach(q=>{
      const l=low(q.answer);
      if(q.type||done.has(q.id)) return;
      if(l==="yes"||l==="no"){ q.type="tf"; q.opts=["Yes","No"]; q.a=l==="yes"?0:1; done.add(q.id); used.add(q.id); }
      else if(l==="true"||l==="false"){ q.type="tf"; q.opts=["True","False"]; q.a=l==="true"?0:1; done.add(q.id); used.add(q.id); }
    });
    const tfPool=plain.filter(q=>!used.has(q.id)&&!done.has(q.id));
    seededPick(tfPool,want.tf,h+7).forEach((q,k)=>{
      const a=norm(q.answer);
      const lowA=low(a);
      if(lowA==="yes"||lowA==="no"){ q.type="tf"; q.opts=["Yes","No"]; q.a=lowA==="yes"?0:1; done.add(q.id); used.add(q.id); return; }
      if(lowA==="true"||lowA==="false"){ q.type="tf"; q.opts=["True","False"]; q.a=lowA==="true"?0:1; done.add(q.id); used.add(q.id); return; }
      const shouldBeTrue=((h+k)%2)===0;
      let shown=a;
      if(!shouldBeTrue){
        const tag=s=>/\(([^)]+)\)\s*$/.test(s) ? RegExp.$1.toLowerCase() : "";
        const mine=tag(q.prompt);
        const sameKind=plain.filter(x=>x.id!==q.id && tag(x.prompt)===mine);
        const named=promptChoices(q.prompt, q.answer);
        const alt = named.length ? seededPick(named,1,h+k*31)[0]
                                 : pickDistractors(q, sameKind.length>=4?sameKind:plain, 1, h+k*31)[0];
        if(!alt) return;
        shown=alt;
      }
      const stem=norm(q.prompt).replace(/\?$/,"");
      q.type="tf";
      q.prompt = isEqn(stem)
        ? ("True or false: "+stem+" = "+shown)
        : ('True or false: the answer to "'+stem+'" is "'+shown+'"');
      q.opts=["True","False"]; q.a=shouldBeTrue?0:1;
      q.answer=shouldBeTrue?"True":"False";
      done.add(q.id); used.add(q.id);
    });

    /* ---- multiple choice for a fifth of what is left ---- */
    const BOOLS=new Set(["true","false","yes","no"]);
    const mcPool=plain.filter(q=>!used.has(q.id)&&!done.has(q.id)&&norm(q.answer).length<=30
                                 && !BOOLS.has(low(q.answer)));
    seededPick(mcPool,want.mc,h+13).forEach((q,k)=>{
      const wrong=pickDistractors(q,plain,3,h+k*13);
      if(wrong.length<3) return;
      const key=x=>String(x).toLowerCase().replace(/['"\u2018\u2019\u201c\u201d.,!?]/g,"").trim();
      const uniq=[norm(q.answer)];
      wrong.forEach(w=>{ if(!uniq.some(u=>key(u)===key(w))) uniq.push(w); });
      if(uniq.length<4) return;
      const opts=seededPick(uniq,4,h+k*7);
      const idx=opts.indexOf(norm(q.answer));
      if(idx<0) return;
      q.type="mc"; q.opts=opts; q.a=idx; done.add(q.id);
    });
  });
}

function buildLanguages(){
  const addLangSet=(name,subject,cards,path,opts)=>{
    opts=opts||{};

      o.speak = (c[2]!=null) ? c[2] : c[1];
      o.speakLang = LANG_CODE[subject] || "en-GB";
      if(opts.listen) o.listen=true;
      S.questions.push(o); return o.id; });
    S.sets.push({id:uid(),name,subject,kind:"prebuilt",path:path||[],createdAt:Date.now(),questionIds:ids});
  };
  for(const lang of Object.keys(LANGDATA)){
    const D=LANGDATA[lang], foreign=!D.literacy, subject=lang;
    // vocabulary, one topic-pure set per theme
    D.themes.forEach((th,ti)=>{
      const cards=[];
      for(const [en,tr] of th.items){
        if(foreign){ cards.push([`${en} (${lang})`, tr]); cards.push([tr, en, tr]); }   // 3rd = word to speak
        else cards.push([en, tr]);
      }
      let name, path;
      if(foreign){ name=THEME_NAMES[ti]||("Set "+(ti+1)); path=["Vocabulary"]; }
      else { const e=EN_THEME[ti]||["Set "+(ti+1),["Vocabulary"]]; name=e[0]; path=e[1]; }
      addLangSet(name, subject, cards, path);
    });
    // numbers
    if(foreign && NUMWORDS[lang]){
      const basic=[], tens=[];
      NUMWORDS[lang].forEach((w,n)=>{ basic.push([`${n} in ${lang}?`, w]); basic.push([w, String(n), w]); });
      (TENWORDS[lang]||[]).forEach(([n,w])=>{ tens.push([`${n} in ${lang}?`, w]); tens.push([w, String(n), w]); });
      addLangSet("0-20", subject, basic, ["Numbers"]);
      if(tens.length) addLangSet("Tens to 100", subject, tens, ["Numbers"]);
    }
    // grammar
    (GRAMMAR[lang]||[]).forEach(g=> addLangSet(g.name, subject, g.cards, g.path));
    // listening / dictation (Latin-script languages where TTS is reliable)
    if(["German","Spanish","French"].includes(lang)){
      const words=[]; D.themes.slice(0,3).forEach(th=> th.items.forEach(([en,tr])=>{ if(words.length<16 && !words.includes(tr)) words.push(tr); }));
      if(words.length) addLangSet("Dictation", subject, words.map(tr=>["Listen and type the word", tr, tr]), ["Listening"], {listen:true});
    }
    // under-construction ghost sets for languages whose grammar isn't ready yet
    if(lang==="Chinese" || lang==="Japanese"){
      [["Grammar","Verbs"],["Grammar","Nouns"],["Grammar","Sentence structure"]].forEach(p=>{
        S.sets.push({id:uid(),name:"Coming soon",subject:lang,kind:"prebuilt",uc:true,path:p,createdAt:Date.now(),questionIds:[]});
      });
    }
  }
}
function setStats(setId){

  if(!a.length) return {count:0,last:null,prev:null,delta:null,best:null,avg:null,series:[]};

  const prev = accs.length>1 ? accs[accs.length-2] : null;
  return {

    avg:Math.round(accs.reduce((s,x)=>s+x,0)/accs.length), series:a

/* a JS string literal that is safe inside a double quoted HTML attribute */
function jsq(s){ return "'"+String(s).replace(/\\/g,"\\\\").replace(/'/g,"\\'").replace(/</g,"\\x3c")+"'"; }
function esc(s){ return (s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function pctColor(p){ if(p==null) return "var(--muted)"; return p>=80?"var(--good)":p>=60?"var(--amber)":"var(--bad)"; }

/* --- fuzzy answer grading --- */
function levenshtein(a,b){
  const m=a.length,n=b.length;
  if(!m) return n; if(!n) return m;
  let prev=Array.from({length:n+1},(_,i)=>i), cur=new Array(n+1);
  for(let i=1;i<=m;i++){
    cur[0]=i;
    for(let j=1;j<=n;j++){
      const cost=a[i-1]===b[j-1]?0:1;
      cur[j]=Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+cost);
    }
    [prev,cur]=[cur,prev];
  }
  return prev[n];
}
// returns "right" | "close" | "wrong"
const STOPWORDS=new Set(["the","a","an","of","to","and","in","it","is","are","for","that","this","with","on","by","its","their"]);
function normLoose(s){ return norm(s).replace(/^(the|a|an)\s+/,"").replace(/\s+/g," ").trim(); }
function pluralVariants(s){
  const out=new Set([s]);
  if(s.endsWith("ies")) out.add(s.slice(0,-3)+"y");
  if(s.endsWith("es"))  out.add(s.slice(0,-2));
  if(s.endsWith("s"))   out.add(s.slice(0,-1));
  out.add(s+"s"); out.add(s+"es");
  return [...out];
}
/* "solid, liquid, gas" should match "gas liquid and solid" */
function listEqual(a,b){
  const split=x=>x.split(/,|;|\band\b/).map(y=>y.trim()).filter(Boolean).sort();
  const pa=split(a), pb=split(b);
  return pa.length>1 && pa.length===pb.length && pa.every((x,i)=>x===pb[i]);
}
/* for long written answers, accept the key words rather than the exact sentence */
function contentWords(s){ return s.split(" ").filter(w=>w.length>2 && !STOPWORDS.has(w)); }
function keyOverlap(t,c){
  const cw=contentWords(c);
  if(cw.length<3) return false;
  const tw=new Set(t.split(" "));
  if(cw.filter(w=>tw.has(w)).length / cw.length >= 0.7) return true;
  // a shorter but correct answer, e.g. "pumps blood" for "pumps blood around the body"
  const tc=contentWords(t);
  return tc.length>=2 && (c.includes(t) || t.includes(c)) && tc.every(w=>cw.includes(w));
}
function gradeAnswer(typed, answer, alts){
  if(norm(answer)==="") return "right";
  if(norm(typed)==="") return "wrong";
  const cands=[answer, ...(alts||[])].filter(Boolean);
  const T=normLoose(typed), Traw=norm(typed);
  let best=Infinity, shortest=Infinity;
  for(const c of cands){
    const C=normLoose(c), Craw=norm(c);
    if(T===C || Traw===Craw) return "right";
    if(listEqual(T,C)) return "right";
    if(pluralVariants(C).includes(T) || pluralVariants(T).includes(C)) return "right";
    if(keyOverlap(T,C)) return "right";
    best=Math.min(best, levenshtein(T,C), levenshtein(Traw,Craw));
    shortest=Math.min(shortest, C.length);
  }
  // about a fifth of the answer length, so "carnivore" is not treated as a typo of "herbivore"
  const window=Math.min(3, Math.max(1, Math.round(shortest*0.2)));
  return best<=window ? "close" : "wrong";
}

/* --- streak --- */
function dayKey(ts){ const d=new Date(ts); return d.getFullYear()+"-"+d.getMonth()+"-"+d.getDate(); }
function computeStreak(){
  const days=new Set(S.attempts.map(a=>dayKey(a.date)));
  if(!days.size) return 0;
  const oneDay=86400000;
  let d=new Date(); d.setHours(0,0,0,0);
  if(!days.has(dayKey(d.getTime()))){                 // nothing today
    d=new Date(d.getTime()-oneDay);                    // allow yesterday
    if(!days.has(dayKey(d.getTime()))) return 0;       // streak broken
  }
  let n=0;
  while(days.has(dayKey(d.getTime()))){ n++; d=new Date(d.getTime()-oneDay); }
  return n;
}
function lerpHex(c1,c2,t){
  const p=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
  const [r1,g1,b1]=p(c1),[r2,g2,b2]=p(c2);
  const m=(a,b)=>Math.round(a+(b-a)*t).toString(16).padStart(2,"0");
  return "#"+m(r1,r2)+m(g1,g2)+m(b1,b2);
}
function streakColor(n){
  if(n<=0) return "#9aa0b4";                 // grey at 0
  if(n>=100) return "#e4b23c";               // gold at 100
  const band=Math.floor(n/10);               // 0 (1-9)  9 (90-99)
  return lerpHex("#1b2140","#e4b23c",band/10); // black → gold
}
function streakTextColor(n){ return n<=0 ? "#4a5578" : "#ffffff"; }

function sparkline(series,w=90,h=30){
  if(!series || series.length===0) return `<div class="sparkwrap" style="color:var(--muted);font-size:11px;display:flex;align-items:center">Not studied yet</div>`;
  const accs = series.map(s=>s.accuracy);
  if(accs.length===1){
    const y = h-4 - (accs[0]/100)*(h-8);
    return `<svg class="sparkwrap" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><circle cx="${w-5}" cy="${y}" r="3.5" fill="${pctColor(accs[0])}"/></svg>`;
  }
  const max=100,min=0;
  const pts = accs.map((a,i)=>{
    const x = (i/(accs.length-1))*(w-8)+4;
    const y = h-4 - ((a-min)/(max-min))*(h-8);
    return [x,y];
  });
  const d = pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const last = pts[pts.length-1];
  const col = pctColor(accs[accs.length-1]);
  return `<svg class="sparkwrap" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
    <path d="${d}" fill="none" stroke="${col}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="3" fill="${col}"/></svg>`;
}

function wireA11y(){
  document.querySelectorAll(".premlock").forEach(ov=>{
    const host=ov.parentElement; if(!host) return;
    host.querySelectorAll('a[href],button,input,select,textarea,[tabindex]:not([tabindex="-1"])').forEach(el=>{
      if(ov.contains(el)) return;
      el.setAttribute("tabindex","-1");
      el.setAttribute("aria-hidden","true");
    });
  });
}

function relTime(ts){
  if(!ts) return "never";
  const s=Math.floor((Date.now()-ts)/1000);
  if(s<60) return "just now";
  if(s<3600) return Math.floor(s/60)+"m ago";
  if(s<86400) return Math.floor(s/3600)+"h ago";
  return Math.floor(s/86400)+"d ago";
}

function deltaTag(delta){

let libFilter = "All", libSearch = "", libPath = [];
function libTabs(){
  const subs = [...new Set(S.sets.map(s=>s.subject))].sort();
  const order = ["Grade Sets","Science","Maths","English","Spanish","French","German","Chinese","Japanese"];
  subs.sort((a,b)=>{ const ia=order.indexOf(a), ib=order.indexOf(b);
    if(ia<0&&ib<0) return a.localeCompare(b); if(ia<0) return 1; if(ib<0) return -1; return ia-ib; });
  return ["All","My sets",...subs];
}
function setsForTab(){
  if(libFilter==="All") return S.sets;
  if(libFilter==="My sets") return S.sets.filter(s=>s.kind==="custom");
  return S.sets.filter(s=>s.subject===libFilter);
}
function searchSets(list, q){
  q=q.toLowerCase().trim();
  return list.map(s=>{
    const hay=(s.name+" "+s.subject+" "+(s.path||[]).join(" ")).toLowerCase();
    let score = hay.includes(q)?3:0, qMatch=0;
    if(score<3){ qMatch = s.questionIds.reduce((c,id)=>{ const qq=S.questions.find(x=>x.id===id); return c+((qq&&(qq.prompt+" "+qq.answer).toLowerCase().includes(q))?1:0); },0); if(qMatch) score=Math.max(score,1); }
    return {s,score,qMatch};
  }).filter(x=>x.score>0).sort((a,b)=>b.score-a.score).slice(0,120);
}
function topicBrowser(list){
  const depth=libPath.length;
  const inPath = s => { const p=s.path||[]; return libPath.every((seg,i)=>p[i]===seg); };
  const leaves = list.filter(s=>{ const p=s.path||[]; return p.length===depth && inPath(s); });
  const childMap={};
  list.forEach(s=>{ const p=s.path||[]; if(p.length>depth && inPath(s)){ const k=p[depth]; childMap[k]=(childMap[k]||0)+1; } });
  const children=Object.keys(childMap).sort();
  const crumb=`<div class="crumb"><button onclick="libPath=[];render()">${esc(libFilter)}</button>${
    libPath.map((seg,i)=>` <span>›</span> <button onclick="libPath=libPath.slice(0,${i+1});render()">${esc(seg)}</button>`).join("")}</div>`;
  const folders = children.length ? `<div class="folders">${children.map(c=>
    `<button class="folder" onclick='libPath=[...libPath,${JSON.stringify(c)}];render()'>
      <div class="fic">${topicIcon(c)}</div>
      <div class="fnm">${esc(c)}</div><div class="fct">${childMap[c]} set${childMap[c]!==1?"s":""}</div></button>`).join("")}</div>` : "";
  const sets = leaves.length ? `<div class="grid" style="margin-top:${children.length?"18px":"0"}">${leaves.map(s=>libCard(s)).join("")}</div>` : "";
  if(!children.length && !leaves.length) return crumb+`<div class="empty"><h3>Nothing in this topic yet</h3></div>`;
  return crumb+folders+sets;
}
function libBody(){
  const scope=setsForTab();
  if(libSearch.trim()){
    const res=searchSets(scope, libSearch);
    return res.length ? `<div class="grid">${res.map(r=>libCard(r.s, r.qMatch)).join("")}</div>`
      : `<div class="empty"><h3>No matches</h3><p>Nothing matched “${esc(libSearch)}”. Try fewer or different words.</p></div>`;
  }
  const isSubject = libFilter!=="All" && libFilter!=="My sets";
  if(isSubject) return topicBrowser(scope);
  return scope.length ? `<div class="grid">${scope.map(s=>libCard(s)).join("")}</div>`
    : `<div class="empty"><h3>No sets here</h3><p>Build one from scratch.</p><button class="btn" onclick="go('create')">Create a set</button></div>`;
}

/* --- per-question status --- */
function qAccuracy(q){ const t=(q.right||0)+(q.wrong||0); return t? (q.right||0)/t : null; }
function qStatus(q){ const t=(q.right||0)+(q.wrong||0); if(!t) return "new"; return (q.wrong||0)===0 ? "right" : "mixed"; }

function viewProgressQuestions(tabs){
  const bySet = progQSel!=="all";
  let rows;
  if(bySet){
    const set = S.sets.find(s=>s.id===progQSel);
    rows = set ? questionsFor(set) : [];
  } else {
    rows = S.questions.filter(q=>((q.right||0)+(q.wrong||0))>0);   // studied only, across all sets
  }
  // sort: attempted worst→best, unattempted last
  rows = rows.slice().sort((a,b)=>{
    const aa=qAccuracy(a), ba=qAccuracy(b);
    if(aa==null&&ba==null) return 0; if(aa==null) return 1; if(ba==null) return -1;
    return aa-ba;
  });
  const weakIds = rows.filter(q=>{ const a=qAccuracy(q); return a!=null && a<1; }).map(q=>q.id);

  // set selector grouped by subject
  const bySubject={}; S.sets.forEach(s=>{ (bySubject[s.subject]=bySubject[s.subject]||[]).push(s); });
  const groups = Object.keys(bySubject).sort().map(sub=>
    `<optgroup label="${esc(sub)}">${bySubject[sub].map(s=>`<option value="${s.id}" ${progQSel===s.id?"selected":""}>${esc(s.name)}</option>`).join("")}</optgroup>`).join("");

  const table = rows.length ? `
    <div class="qtable">
      <div class="qthead"><span></span><span>Question</span><span>Answer</span><span>Correct</span><span>Seen</span></div>
      ${rows.map(q=>{
        const t=(q.right||0)+(q.wrong||0), acc=qAccuracy(q), st=qStatus(q);
        const owner = ownerSet(q);
        if(qHidden(q, owner)){
          return `<div class="qtrow locked-row">
            <span class="qsq new"></span>
            <span class="qtq premhidden">Premium question</span>
            <span class="qta"><button class="premrow" onclick="openUpgrade()">✦ Unlock</button></span>
            <span class="mono" style="color:var(--muted)">.</span><span class="mono" style="color:var(--muted)">.</span>
          </div>`;
        }
        return `<div class="qtrow">
          <span class="qsq ${st}" role="img" aria-label="${st==='right'?'All correct':st==='mixed'?'Missed or guessed':'Not studied yet'}" title="${st==='right'?'All correct':st==='mixed'?'Missed or guessed':'Not studied yet'}"></span>
          <span class="qtq">${esc(q.prompt)}</span>
          <span class="qta">${esc(q.answer||"-")}</span>
          <span class="mono" style="color:${acc==null?'var(--muted)':pctColor(Math.round(acc*100))}">${acc==null?"-":Math.round(acc*100)+"%"}</span>
          <span class="mono" style="color:var(--muted)">${t||"-"}</span>
        </div>`;
      }).join("")}
    </div>` : `<div class="empty"><h3>Nothing studied yet</h3><p>Study a set and your questions will appear here, weakest first.</p></div>`;

  return `
  <div class="head">
    <div class="eyebrow">Progress</div>
    <h1>Every question, weakest first</h1>
    <p>Sorted from the questions you get wrong most to the ones you've mastered.</p>
  </div>
  ${tabs}
  <div class="qtoolbar">
    <select class="qsel" onchange="progQSel=this.value;render()">
      <option value="all" ${progQSel==="all"?"selected":""}>All studied questions</option>
      ${groups}
    </select>
    <div class="qlegend">
      <span><i class="qsq right" aria-hidden="true"></i>Correct</span>
      <span><i class="qsq mixed" aria-hidden="true"></i>Wrong / guessed</span>
      <span><i class="qsq new" aria-hidden="true"></i>Not done</span>
    </div>
    <button class="btn good" ${weakIds.length?"":"disabled"} onclick='startPractice(${JSON.stringify(weakIds)},"Weakest questions")'>Practice lowest (${weakIds.length})</button>
  </div>
  ${table}`;
}

/* subject insights + storage cleanup */
function subjectInsights(){
  const bySub={};
  S.attempts.forEach(a=>{ const set=S.sets.find(s=>s.id===a.setId); if(!set) return;
    const k=set.subject; (bySub[k]=bySub[k]||{accs:[],sets:new Set()}); bySub[k].accs.push(a.accuracy); bySub[k].sets.add(a.setId); });
  return Object.keys(bySub).sort().map(sub=>{
    const d=bySub[sub], avg=Math.round(d.accs.reduce((s,x)=>s+x,0)/d.accs.length);
    const status = avg>=80?"solid" : avg>=60?"ok" : "work";
    return {sub, avg, sets:d.sets.size, sessions:d.accs.length, status};
  }).sort((a,b)=>a.avg-b.avg);
}
function doneSets(){
  return S.sets.map(s=>({s, st:setStats(s.id)})).filter(x=>x.st.count>0 && x.st.best>=90);
}
function removeSetProgress(setId){
  const set=S.sets.find(s=>s.id===setId); if(!set) return;
  S.attempts = S.attempts.filter(a=>a.setId!==setId);
  questionsFor(set).forEach(q=>{ q.right=0; q.wrong=0; q.hintPending=false; });
  save(); toast("Progress cleared"); render();
}
function clearMastered(){
  const done=doneSets();
  if(!done.length){ toast("No mastered sets to clear"); return; }
  if(!confirm(`Remove saved progress for ${done.length} mastered set${done.length!==1?"s":""}? The sets stay; only their scores are cleared.`)) return;
  done.forEach(({s})=>{ S.attempts=S.attempts.filter(a=>a.setId!==s.id); questionsFor(s).forEach(q=>{q.right=0;q.wrong=0;q.hintPending=false;}); });
  save(); toast(`Cleared ${done.length} set${done.length!==1?"s":""}`); render();
}
function viewInsights(tabs){
  const head=`<div class="head"><div class="eyebrow">Progress</div><h1>Insights ✦</h1>
    <p>Where you're strong, and what could use another look.</p></div>${tabs}`;
  if(!isPremium()){
    return head + `<div class="panel locked" style="min-height:220px;position:relative">
      ${premiumOverlay("Subject insights are a Premium feature. See which subjects need work at a glance.")}
      <div style="filter:blur(3px);opacity:.5"><h2>German needs work</h2><p>62% average across 3 sessions</p><h2>Maths is solid</h2><p>91% average</p></div>
    </div>`;
  }
  const ins=subjectInsights();
  const done=doneSets();
  const cards = ins.length ? `<div class="grid">${ins.map(r=>{
    const [bg,fg]=subjColor(r.sub);
    const label=r.status==="work"?"Needs work":r.status==="ok"?"Getting there":"Solid";
    const col=r.status==="work"?"var(--bad)":r.status==="ok"?"var(--amber)":"var(--good)";
    const tip=r.status==="work"?"Focus a few sessions here, practise the weakest questions.":r.status==="ok"?"Close, a bit more practice will lift this.":"Great, keep it ticking over.";
    return `<div class="card">
      <div class="top"><h3>${SUBJECT_ICON[r.sub]||""} ${esc(r.sub)}</h3><span class="chip" style="background:${bg};color:${fg}">${esc(r.sub)}</span></div>
      <div style="display:flex;align-items:center;gap:10px;margin:4px 0 8px">
        <span class="mono" style="font-size:26px;font-weight:700;color:${col}">${r.avg}%</span>
        <span class="delta ${r.status==='solid'?'up':r.status==='work'?'down':'flat'}" style="height:fit-content">${label}</span>
      </div>
      <div style="font-size:13px;color:var(--muted);line-height:1.5">${tip}</div>
      <div class="meta"><span>${r.sets} set${r.sets!==1?"s":""}</span><span>${r.sessions} session${r.sessions!==1?"s":""}</span></div>
    </div>`;
  }).join("")}</div>` : `<div class="empty"><h3>No data yet</h3><p>Study a few sets and insights will appear here.</p></div>`;

  const manage = `<div class="panel" style="margin-top:20px">
    <h2>Manage saved sets <span class="mono" style="color:var(--accent)">${done.length} done</span></h2>
    <div class="sub">Clear progress for sets you've mastered (90% or above) to tidy up. The sets stay, and only their scores are removed.</div>
    ${done.length ? `<div class="donelist">${done.map(({s,st})=>`<div class="donerow">
      <span>${SUBJECT_ICON[s.subject]||""} ${esc(s.name)} <span style="color:var(--muted);font-size:12px">· ${esc(s.subject)}</span></span>
      <span class="mono" style="color:var(--good);margin-left:auto">${st.best}%</span>
      <button class="btn danger sm" onclick="removeSetProgress('${s.id}')">Remove</button></div>`).join("")}</div>
      <button class="btn danger" style="margin-top:14px" onclick="clearMastered()">Clear all ${done.length} mastered</button>`
    : `<div style="color:var(--muted);font-size:13.5px">Nothing mastered yet, sets you score 90%+ on will show here.</div>`}
  </div>`;
  return head + cards + manage;
}

function progressDetail(set){
  const st = setStats(set.id);
  if(st.count===0){
    return `<div class="chartwrap"><h2 style="font-size:20px;margin-bottom:6px">${esc(set.name)}</h2>
      <p style="color:var(--muted);font-size:14px">No attempts yet. Study this set and your first point lands here.</p>
      <button class="btn good sm" style="margin-top:14px" onclick="startPlay('${set.id}')">Study now</button></div>`;
  }
  return `<div class="chartwrap">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:6px">
      <h2 style="font-size:20px">${esc(set.name)}</h2>
      <button class="btn good sm" onclick="startPlay('${set.id}')">Study</button>
    </div>
    <div class="strip" style="margin:14px 0 18px">
      <div class="stat"><div class="k">Attempts</div><div class="v">${st.count}</div></div>
      <div class="stat"><div class="k">Best</div><div class="v" style="color:${pctColor(st.best)}">${st.best}%</div></div>
      <div class="stat"><div class="k">Average</div><div class="v" style="color:${pctColor(st.avg)}">${st.avg}%</div></div>
    </div>
    ${lineChart(st.series)}
  </div>`;
}
function lineChart(series){
  const W=520,H=240,pad={l:38,r:16,t:16,b:34};
  const iw=W-pad.l-pad.r, ih=H-pad.t-pad.b;
  const n=series.length;
  const xFor = i => n===1 ? pad.l+iw/2 : pad.l + (i/(n-1))*iw;
  const yFor = v => pad.t + (1-v/100)*ih;
  const grid = [0,25,50,75,100].map(v=>`
    <line x1="${pad.l}" y1="${yFor(v)}" x2="${W-pad.r}" y2="${yFor(v)}" stroke="var(--line)" stroke-width="1"/>
    <text x="${pad.l-8}" y="${yFor(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="Space Mono,monospace">${v}</text>`).join("");
  const pts = series.map((s,i)=>[xFor(i),yFor(s.accuracy)]);
  const line = pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const area = n>1 ? `M${pts[0][0].toFixed(1)} ${(pad.t+ih).toFixed(1)} `+pts.map(p=>"L"+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ")+` L${pts[n-1][0].toFixed(1)} ${(pad.t+ih).toFixed(1)} Z` : "";
  const dots = pts.map((p,i)=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4.5" fill="#fff" stroke="var(--accent)" stroke-width="2.5"/>
    <text x="${p[0].toFixed(1)}" y="${(p[1]-12).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--accent)" font-family="Space Mono,monospace">${series[i].accuracy}%</text>`).join("");
  const xlabels = series.map((s,i)=>{
    const d=new Date(s.date); const lab=(d.getMonth()+1)+"/"+d.getDate();
    return `<text x="${xFor(i).toFixed(1)}" y="${H-10}" text-anchor="middle" font-size="10.5" fill="var(--muted)">${lab}</text>`;
  }).join("");
  return `<svg width="100%" viewBox="0 0 ${W} ${H}" style="max-width:100%;overflow:visible">
    <defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--accent)" stop-opacity="0.18"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
    ${grid}
    ${area?`<path d="${area}" fill="url(#ag)"/>`:""}
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    ${dots}${xlabels}
  </svg>`;
}

/* ============================ SESSION SETUP ============================ */
let sess = { setId:null, focus:"all", count:10 };
function startPlay(setId){
  const set = S.sets.find(s=>s.id===setId);
  if(!set){ return; }
  if(set.uc){ toast("🚧 This topic is under construction"); return; }
  if(setLocked(set)){ cornerToast("This whole set is Premium.", true); openUpgrade(); return; }
  if(!set.questionIds.length){ toast("This set has no questions yet"); return; }
  sess = { setId, focus:"all", count:null };  // count null = default resolved in view
  view="setup"; render();
}
function availableCount(){
  const set = S.sets.find(s=>s.id===sess.setId); if(!set) return 0;
  if(sess.focus==="weak"){ const w=questionsFor(set).filter(isWeak).length; return w||questionsFor(set).length; }
  return questionsFor(set).length;
}
function countOptions(avail){
  const opts=[5,10,20,50].filter(n=>n<avail);
  opts.push(avail); // "All"
  return opts;
}
function viewSetup(){
  const set = S.sets.find(s=>s.id===sess.setId);
  if(!set) return "";
  const weak = questionsFor(set).filter(isWeak).length;
  const avail = availableCount();
  const opts = countOptions(avail);
  if(sess.count==null || sess.count>avail) sess.count = Math.min(10, avail); // sensible default
  const focusSeg = (val,label,extra="") =>
    `<button class="opt ${sess.focus===val?"on":""}" onclick="sess.focus='${val}';sess.count=null;render()">${label}${extra}</button>`;
  return `
  <div class="head"><div class="eyebrow">Study session</div>
    <h1>${esc(set.name)}</h1>
    <p>Pick your focus and how many questions. Cards are shuffled automatically.</p></div>
  <div class="player" style="max-width:560px">
    <div class="pbody">
      <div class="setup-block">
        <div class="setup-lbl">Focus</div>
        <div class="opts">
          ${focusSeg("all","All cards")}
          ${focusSeg("weakest","Weakest first")}
          ${focusSeg("weak","Weak only",weak?` <b class="mono">${weak}</b>`:"")}
        </div>
      </div>
      <div class="setup-block">
        <div class="setup-lbl">How many questions</div>
        <div class="opts">
          ${opts.map(n=>`<button class="opt ${sess.count===n?"on":""}" onclick="sess.count=${n};render()">${n===avail?`All (${avail})`:n}</button>`).join("")}
        </div>
        <div class="note">Drawn at random from ${avail} card${avail!==1?"s":""}${sess.focus==="weakest"?", weakest first (kept in order)":", shuffled"}.</div>
      </div>
      <div class="row" style="margin-top:22px">
        <button class="btn good wide" onclick="beginSession()">Start studying</button>
        <button class="btn ghost" onclick="go('library')">Cancel</button>
      </div>
    </div>
  </div>`;
}
function beginSession(){
  const set = S.sets.find(s=>s.id===sess.setId);
  if(!set) return;
  let qs = questionsFor(set).slice();
  if(sess.focus==="weak"){
    const w = qs.filter(isWeak);
    if(w.length) qs = w; else toast("No weak cards yet, running all of them");
  }
  const n = sess.count || qs.length;
  if(sess.focus==="weakest"){
    qs.sort((a,b)=>{ const wa=cardAccuracy(a), wb=cardAccuracy(b);
      return (wa==null?1.01:wa)-(wb==null?1.01:wb); });
    qs = qs.slice(0, n);                 // take the n weakest, in order
  } else {
    shuffleInPlace(qs);                  // auto-shuffle
    qs = qs.slice(0, n);
  }
  play = { set, qs, i:0, correct:0, phase:"ask", result:null, typed:"", rowStreak:0, doubled:false, soClose:false, answered:0, skipped:0 };
  view="player";
  if(advancePastLocked()) return;
  render();
}
let play = null;   // active study session
function advancePastLocked(){
  if(!play) return false;
  let n=0, guard=0;
  while(play.i<play.qs.length && qLocked(play.qs[play.i], play.set) && guard++<500){ play.i++; n++; }
  if(n) cornerToast(n===1?"That question is Premium, so it was skipped.":n+" questions here are Premium, so they were skipped.", true);
  play.skipped=(play.skipped||0)+n;
  if(play.i>=play.qs.length){ finishPlay(); return true; }
  return false;
}
function startPractice(ids, label){
  const qs = ids.map(id=>S.questions.find(q=>q.id===id)).filter(Boolean);
  if(!qs.length){ toast("No questions to practise"); return; }
  shuffleInPlace(qs);
  play = { set:{id:"_practice", name:label||"Practice", kind:"practice"}, qs, i:0, correct:0,
           phase:"ask", result:null, typed:"", rowStreak:0, doubled:false, soClose:false, practice:true };
  view="player"; render();
}
function viewPlayer(){
  if(!play) return "";
  const {set,qs,i}=play;
  if(play.phase==="done"){
    const shown = play.shown || qs.length;
    const acc = Math.round((play.correct/shown)*100);
    return `<div class="player">
      <div class="pbar"><i style="width:100%"></i></div>
      <div class="pbody" style="text-align:center">
        <div class="pcount">SESSION COMPLETE</div>
        <h1 style="font-size:52px;margin:14px 0 4px;color:${pctColor(acc)}" class="mono">${acc}%</h1>
        <p style="color:var(--muted);margin:0 0 24px">${play.correct} of ${shown} correct · ${esc(set.name)}${play.skipped?" · "+play.skipped+" Premium skipped":""}</p>
        <div class="row" style="justify-content:center">
          ${play.practice
            ? `<button class="btn good" onclick="go('progress')">Back to questions</button>
               <button class="btn ghost" onclick="go('home')">Home</button>`
            : `<button class="btn good" onclick="startPlay('${set.id}')">Study again</button>
               <button class="btn ghost" onclick="go('progress','${set.id}')">See progress</button>
               <button class="btn ghost" onclick="go('home')">Home</button>`}
        </div>
      </div></div>`;
  }
  const q = qs[i];
  const pct = Math.round((i/qs.length)*100);
  const hasAnswer = q.answer && q.answer.trim();
  const r = play.result;
  const editable = r===null || r==="close";

  const aEdit = `data-qid="${q.id}" data-field="answer"`;
  let feedback = "", action = "", banner = "";
  if(!hasAnswer){
    feedback = `<div class="reveal" style="background:var(--accent-soft);color:var(--ink)">
      <span class="lbl">No answer stored</span>This is a self-study card. Read it, recall the answer, then continue.</div>`;
    action = `<button class="btn wide" onclick="nextQ(true)">Next</button>`;
  } else if(r===null){
    const pick = q.type==="mc" || q.type==="tf";   // click to answer, no Submit needed
    action = `<div class="two-actions">
      ${pick ? `<div class="pickhint">Choose the right answer above.</div>`
             : `<button class="btn wide" onclick="submitAnswer()">Submit <span class="kbd">Enter</span></button>`}
      <button class="btn ghost hintbtn" onclick="useHint()">Show hint</button></div>`;
  } else if(r==="right"){
    feedback = `<div class="reveal ok"><span class="lbl">${play.doubled?"Correct! Counts twice":"Correct"}</span>${edt(q.answer,aEdit)}</div>`;
    action = `<button class="btn wide good" onclick="nextQ()">Next <span class="kbd">Enter</span></button>`;
    banner = `<div class="rowbanner good"><b>${play.rowStreak} in a row</b> · ${congratsPhrase(play.rowStreak)}, keep it going!</div>`;
  } else if(r==="close"){
    feedback = `<div class="reveal" style="background:#fdf3e0;color:#8a5a10"><span class="lbl">So close</span>A slip or two off. Fix the spelling and submit again.</div>`;
    action = `<button class="btn wide warn" onclick="submitAnswer()">Try again</button>`;
  } else if(r==="hint"){
    feedback = `<div class="reveal" style="background:var(--ai-soft);color:#5b3aa8"><span class="lbl">Here's the answer</span>${edt(q.answer,aEdit)}<div style="margin-top:6px;font-size:12.5px;opacity:.85">Nail it next time and it counts twice.</div></div>`;
    action = `<button class="btn wide" onclick="nextQ()">Next</button>`;
  } else { // wrong
    feedback = `<div class="reveal no"><span class="lbl">Answer</span>${edt(q.answer,aEdit)}</div>`;
    action = `<button class="btn wide bad" onclick="nextQ()">Next <span class="kbd">Enter</span></button>`;
    banner = `<div class="rowbanner bad">Bad luck. Streak reset! Get the next one to start again.</div>`;
  }

  return `<div class="player">
    <div class="pbar"><i style="width:${pct}%"></i></div>
    <div class="pbody">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div class="pcount">QUESTION ${i+1} / ${qs.length}</div>
        <div class="pcount">${esc(set.name)}</div>
      </div>
      ${q.listen
        ? `<div class="listencard">
             <button class="audiobtn big" onclick="speakFor(play.qs[${i}])" title="Play again"><span class="apulse">🔊</span></button>
             <div class="listenhint">Listen and type the word</div>
           </div>`
        : `<div class="qtext">${edt(q.prompt, `data-qid="${q.id}" data-field="prompt"`)}
             ${(q.speak || q.subject==="Maths" || q.subject==="Science") ? `<button class="audiobtn" aria-label="Hear it" onclick="speakFor(play.qs[${i}])" title="Hear it">🔊</button>` : ""}
           </div>`}
      ${play.soClose?`<div class="soclose">So close! You used a hint on this one before. It will come round again.</div>`:""}
      ${hasAnswer ? playerInput(q, editable) : ""}
      ${feedback}
      <div class="row" style="margin-top:18px">${action}</div>
      ${banner}
    </div></div>`;
}
/* Enter submits, and once an answer is showing, Enter moves on */
function playerKey(e){
  if(view!=="player" || !play) return;
  if(e.key!=="Enter") return;
  if(document.getElementById("modalRoot")?.firstChild) return;      // a window is open
  const t=e.target;
  if(t && t.tagName==="TEXTAREA") return;                            // writing notes
  if(play.phase==="done") return;                 // nothing to submit, leave the buttons to it
  const q=play.qs[play.i];
  if(!q) return;
  e.preventDefault();
  const hasAnswer = q.answer && String(q.answer).trim();
  if(!hasAnswer){ nextQ(true); return; }           // a read and recall card, just move on
  const r=play.result;
  if(r===null || r==="close") submitAnswer();
  else nextQ();
}
function wirePlayer(){
  if(!window._playerKeys){ window._playerKeys=true; document.addEventListener("keydown", playerKey); }
  const q = play && play.qs[play.i];
  if(q && q.listen && play.result===null) setTimeout(()=>speakFor(q), 250);   // auto-play dictation word
  const inp = document.getElementById("ansInput");
  if(inp && !inp.disabled){
    inp.focus();
    const v=inp.value; inp.value=""; inp.value=v; // caret to end
    inp.oninput = e => { play.typed = e.target.value; };
    inp.onkeydown = e => { if(e.key==="Enter") e.preventDefault(); };   // handled globally
  }
}
function playerInput(q, editable){
  const done = play.result!==null && play.result!=="close";
  if(q.type==="mc" || q.type==="tf"){
    return `<div class="opts-list">${q.opts.map((o,oi)=>{
      let cls="";
      if(done){ if(oi===q.a) cls="pickright"; else if(oi===play.choice) cls="pickwrong"; }
      const letter = q.type==="tf" ? (String(o).toLowerCase()[0]||"?").toUpperCase() : String.fromCharCode(65+oi);
      return `<button class="optrow ${cls}" ${done?"disabled":""} onclick="answerChoice(${oi})">
        <span class="optletter">${letter}</span>${esc(o)}</button>`;
    }).join("")}</div>`;
  }
  if(q.type==="multi"){
    if(!play.picks) play.picks=[];
    const need=q.a.length;
    return `<div class="orderhint">Choose ${need}, then press Submit.</div>
      <div class="opts-list">${q.opts.map((o,oi)=>{
        const on=play.picks.includes(oi);
        let cls=on?"on":"";
        if(done){ if(q.a.includes(oi)) cls="pickright"; else if(on) cls="pickwrong"; }
        return `<button class="optrow ${cls}" ${done?"disabled":""} onclick="toggleMulti(${oi})">
          <span class="optbox">${on?"✓":""}</span>${esc(o)}</button>`;
      }).join("")}</div>`;
  }
  if(q.type==="match"){
    if(!play.pairs) play.pairs={};
    if(!play.pool){
      play.pool = shuffleInPlace(q.mR.map((t,i)=>({t, i})));
    }
    const takenPool=new Set(Object.values(play.pairs));
    const filled=Object.keys(play.pairs).length, total=q.mL.length;
    return `<div class="matchtop">
        <b>Match all ${total}.</b> Tap one on the left, then tap its partner below.
        <span class="matchcount ${filled===total?"full":""}">${filled} of ${total} matched</span>
      </div>
      <div class="matchrows">
        ${q.mL.map((l,li)=>{
          const pi=play.pairs[li];
          const has = pi!=null;
          let cls="";
          if(done && has) cls = (play.pool[pi].t===q.mR[li]) ? "mright" : "mwrong";
          else if(has) cls="mfilled";
          return `<div class="matchrow ${play.matchSel===li?"sel":""} ${cls}" ${done?"":`onclick="selectMatch(${li})"`}>
            <span class="mnum">${li+1}</span>
            <span class="mleft">${esc(l)}</span>
            <span class="mslot ${has?"on":""}">${has?esc(play.pool[pi].t):"tap to fill"}</span>
            ${(!done && has)?`<span class="mclear" onclick="event.stopPropagation();clearMatch(${li})">&times;</span>`:""}
            ${(done && play.pool[pi]?.t!==q.mR[li])?`<span class="mtrue">${esc(q.mR[li])}</span>`:""}
          </div>`;
        }).join("")}
      </div>
      ${done?"":`<div class="matchpoollbl">Tap a partner:</div>
      <div class="matchpool">
        ${play.pool.map((p,pi)=> takenPool.has(pi) ? "" :
          `<button class="mchip ${play.chipSel===pi?"sel":""}" onclick="pickChip(${pi})">${esc(p.t)}</button>`).join("")}
      </div>`}`;
  }
  if(q.type==="order"){
    if(!play.orderArr) play.orderArr = shuffleInPlace(q.order.slice());
    const arr = play.orderArr;
    return `<div class="orderhint">Put these in the right order, then press Submit.</div>
      <div class="orderlist" id="playOrder">
        ${arr.map((t,oi)=>`<div class="orderbox" ${done?"":'draggable="true"'} data-idx="${oi}">
          <span class="ordergrip">⠿</span><span class="ordernum">${oi+1}</span>
          <span class="ordertext">${esc(t)}</span>
          <span class="orderarrows">
            <button onclick="movePlayOrder(${oi},-1)" ${oi===0||done?"disabled":""}>▲</button>
            <button onclick="movePlayOrder(${oi},1)" ${oi===arr.length-1||done?"disabled":""}>▼</button>
          </span></div>`).join("")}
      </div>`;
  }
  return `<input class="ans" id="ansInput" placeholder="${q.listen?'Type what you hear':'Type your answer'}" ${editable?"":"disabled"} value="${esc(play.typed||"")}" autocomplete="off" autocapitalize="off" spellcheck="false">
      ${editable?symbolBar("ansInput", q.subject):""}`;
}
function toggleMulti(i){
  if(play.result!==null && play.result!=="close") return;
  play.picks=play.picks||[];
  const k=play.picks.indexOf(i);
  if(k>-1) play.picks.splice(k,1); else play.picks.push(i);
  sfx("click"); render();
}
function selectMatch(li){
  if(play.result!==null && play.result!=="close") return;
  if(play.chipSel!=null){                 // a partner was picked first, drop it in
    play.pairs=play.pairs||{};
    for(const k in play.pairs){ if(play.pairs[k]===play.chipSel) delete play.pairs[k]; }
    play.pairs[li]=play.chipSel;
    play.chipSel=null; play.matchSel=null; sfx("click"); render(); return;
  }
  play.matchSel = (play.matchSel===li) ? null : li;
  sfx("click"); render();
}
function pickChip(pi){
  if(play.result!==null && play.result!=="close") return;
  if(play.matchSel!=null){                // a row was chosen first, fill it
    play.pairs=play.pairs||{};
    for(const k in play.pairs){ if(play.pairs[k]===pi) delete play.pairs[k]; }
    play.pairs[play.matchSel]=pi;
    play.matchSel=null; play.chipSel=null; sfx("click"); render(); return;
  }
  play.chipSel = (play.chipSel===pi) ? null : pi;   // otherwise hold it and wait for a row
  sfx("click"); render();
}
function clearMatch(li){
  if(play.result!==null && play.result!=="close") return;
  if(play.pairs) delete play.pairs[li];
  play.matchSel=null; play.chipSel=null; sfx("click"); render();
}
function movePlayOrder(i, dir){
  const j=i+dir; const a=play.orderArr;
  if(!a || j<0 || j>=a.length) return;
  [a[i],a[j]]=[a[j],a[i]]; sfx("click"); render();
}
function wirePlayOrder(){
  const list=document.getElementById("playOrder"); if(!list) return;
  let from=null;
  list.querySelectorAll(".orderbox").forEach(box=>{
    box.addEventListener("dragstart",()=>{ from=+box.dataset.idx; box.classList.add("dragging"); });
    box.addEventListener("dragend",()=>box.classList.remove("dragging"));
    box.addEventListener("dragover",e=>{ e.preventDefault(); box.classList.add("over"); });
    box.addEventListener("dragleave",()=>box.classList.remove("over"));
    box.addEventListener("drop",e=>{ e.preventDefault(); box.classList.remove("over");
      const to=+box.dataset.idx; if(from===null||from===to) return;
      const a=play.orderArr; const [m]=a.splice(from,1); a.splice(to,0,m); sfx("click"); render(); });
  });
}
/* answering a multiple choice or true/false option marks it straight away */
function answerChoice(idx){
  const q=play.qs[play.i];
  if(play.result!==null && play.result!=="close") return;
  play.choice=idx;
  gradeOutcome(idx===q.a, q);
}
function gradeOutcome(ok, q){
  ensureStats(q);
  play.doubled=false; play.soClose=false;
  if(ok){
    if(q.hintPending){ q.right+=2; q.hintPending=false; play.doubled=true; }
    else q.right+=1;
    play.correct++; play.rowStreak++;
    play.result="right";
    sfx(play.rowStreak>=2 ? "streak" : "correct");
  } else {
    if(q.hintPending){ q.wrong+=1; q.hintPending=false; play.soClose=true; }
    else q.wrong+=1;
    play.rowStreak=0; play.result="wrong"; sfx("wrong");
  }
  save(); render();
}
function submitAnswer(){
  const q = play.qs[play.i];
  if(q.type==="mc" || q.type==="tf"){ if(play.choice==null) toast("Choose an answer first"); return; }
  if(q.type==="multi"){
    const picks=(play.picks||[]).slice().sort((a,b)=>a-b);
    if(picks.length!==q.a.length){ toast("Choose exactly "+q.a.length); return; }
    const want=q.a.slice().sort((a,b)=>a-b);
    gradeOutcome(picks.every((v,k)=>v===want[k]), q); return;
  }
  if(q.type==="match"){
    const p=play.pairs||{};
    if(Object.keys(p).length!==q.mL.length){ toast("Match them all first"); return; }
    gradeOutcome(q.mL.every((_,li)=> play.pool[p[li]] && play.pool[p[li]].t===q.mR[li]), q); return;
  }
  if(q.type==="order"){
    const ok = play.orderArr && play.orderArr.every((v,k)=>v===q.order[k]);
    gradeOutcome(ok, q); return;
  }
  const inp = document.getElementById("ansInput");
  if(inp) play.typed = inp.value;
  const g = gradeAnswer(play.typed, q.answer, q.alt);
  if(g==="close"){ play.result="close"; sfx("partial"); render(); return; }   // typo, retry, no scoring yet
  ensureStats(q);
  play.doubled=false; play.soClose=false;
  if(g==="right"){
    if(q.hintPending){ q.right += 2; q.hintPending=false; play.doubled=true; }
    else q.right += 1;
    play.correct++; play.rowStreak++;
    play.result="right";
    sfx(play.rowStreak>=2 ? "streak" : "correct");
  } else {
    if(q.hintPending){ q.wrong += 1; q.hintPending=false; play.soClose=true; }
    else q.wrong += 1;
    play.rowStreak = 0;
    play.result="wrong";
    sfx("wrong");
  }
  save(); render();
}
function useHint(){
  const inp = document.getElementById("ansInput");
  if(inp) play.typed = inp.value;
  const q = play.qs[play.i];
  ensureStats(q);
  q.wrong += 1; q.hintPending = true;
  play.rowStreak = 0; play.result="hint";
  save(); render();
}
function nextQ(neutral){
  if(neutral) play.correct++;
  play.answered=(play.answered||0)+1;
  play.result=null; play.typed=""; play.choice=null; play.orderArr=null; play.picks=null; play.pairs=null; play.pool=null; play.matchSel=null; play.chipSel=null; play.doubled=false; play.soClose=false;
  play.i++;
  if(play.i>=play.qs.length){ finishPlay(); return; }
  if(advancePastLocked()) return;
  play.phase="ask"; render();
}
function quitSession(){ if(!confirmLeaveSet()) return; play=null; go("library"); }
function skipLocked(){
  play.result=null; play.typed=""; play.doubled=false; play.soClose=false;
  play.i++;
  if(play.i>=play.qs.length){ finishPlay(); }
  else { play.phase="ask"; render(); }
}
/* ---- end of session celebration, colour follows the score ---- */
function scoreColour(pct){
  const stops=[[0,[168,32,42]],[50,[231,154,43]],[100,[22,196,127]]];  // dark red > amber > vivid green
  let a=stops[0], b=stops[stops.length-1];
  for(let i=0;i<stops.length-1;i++){ if(pct>=stops[i][0] && pct<=stops[i+1][0]){ a=stops[i]; b=stops[i+1]; break; } }
  const span=b[0]-a[0] || 1, t=Math.min(1,Math.max(0,(pct-a[0])/span));
  const c=a[1].map((v,i)=>Math.round(v+(b[1][i]-v)*t));
  return `rgb(${c[0]}, ${c[1]}, ${c[2]})`;
}
function celebrationWords(pct){
  if(pct>=100) return ["Perfect score", "Every single one correct."];
  if(pct>=90)  return ["Outstanding", "Almost perfect work."];
  if(pct>=75)  return ["Well done", "That is a strong result."];
  if(pct>=60)  return ["Good effort", "You are getting there."];
  if(pct>=40)  return ["Keep going", "Worth another run at this one."];
  if(pct>0)    return ["Tough one", "Try it again, it gets easier."];
  return ["Not this time", "Have another go, you will improve."];
}
function celebrate(pct){
  const el=document.getElementById("celebrate"); if(!el) return;
  const col=scoreColour(pct), w=celebrationWords(pct);
  const bits = pct>=75 ? Array.from({length:14},(_,i)=>
    `<i class="cbit" style="left:${5+i*6.7}%;animation-delay:${(i%7)*0.09}s;background:${col}"></i>`).join("") : "";
  el.innerHTML=`<div class="celvig" style="--cel:${col}">${bits}
    <div class="celcard"><div class="celpct mono" style="color:${col}">${pct}%</div>
      <div class="celtitle">${esc(w[0])}</div><div class="celsub">${esc(w[1])}</div></div></div>`;
  el.classList.add("show");
  sfx(pct>=75?"streak":pct>=40?"correct":"partial");
  clearTimeout(el._t);
  el._t=setTimeout(()=>{ el.classList.remove("show"); setTimeout(()=>{ el.innerHTML=""; },400); }, pct>=75?2600:2000);
}
function finishPlay(){
  play.phase="done";
  play.shown=Math.max(1, play.qs.length-(play.skipped||0));
  if(!play.practice){                 // practice runs update per-question stats but don't log a set attempt
    const acc = Math.round((play.correct/play.shown)*100);
    S.attempts.push({id:uid(),setId:play.set.id,date:Date.now(),total:play.shown,correct:play.correct,accuracy:acc});
  }
  save(); if(profile.email) touchRegistry(profile.email); render();
  celebrate(Math.round((play.correct/play.shown)*100));
}

const MATH_SYMBOLS = ["√","π","²","³","½","¼","¾","×","÷","±","°","≈","≤","≥","≠","∞","θ"];
const ACCENTS = {
  German:["ä","ö","ü","Ä","Ö","Ü","ß"],
  Spanish:["á","é","í","ó","ú","ñ","ü","¿","¡"],
  French:["à","â","ç","é","è","ê","ë","î","ï","ô","û","ù","œ"],
};
function symbolsFor(subject){
  if(subject==="Maths") return MATH_SYMBOLS;
  return ACCENTS[subject] || null;
}
function symbolBar(targetId, subject){
  const syms = symbolsFor(subject);
  if(!syms || !syms.length) return "";
  return `<div class="symbar">${syms.map(s=>`<button type="button" class="symb" onmousedown="event.preventDefault()" onclick="insertSym('${targetId}',${jsq(s)})">${s}</button>`).join("")}</div>`;
}
function insertSym(targetId, ch){
  const el = document.getElementById(targetId);
  if(!el) return;
  const s = el.selectionStart ?? el.value.length, e = el.selectionEnd ?? el.value.length;
  el.value = el.value.slice(0,s) + ch + el.value.slice(e);
  const pos = s + ch.length;
  el.focus(); try{ el.setSelectionRange(pos,pos); }catch(_){}
  el.dispatchEvent(new Event("input"));   // sync play.typed / draft state
}

    if(bankFilter==="answered") return (q.answered||0)>0;

function solveArith(prompt){
  const m = String(prompt).replace(/[=?]/g,"").trim().match(/^(\d+)\s*([+\-−×xX*÷/])\s*(\d+)$/);
  if(!m) return null;
  const a=+m[1], op=m[2], b=+m[3];
  if(op==="+") return String(a+b);
  if(op==="-"||op==="−") return String(a-b);
  if(op==="×"||op==="x"||op==="X"||op==="*") return String(a*b);
  if((op==="÷"||op==="/") && b) return Number.isInteger(a/b)?String(a/b):String(+(a/b).toFixed(2));
  return null;
}
function genMath(topic, count){
  const t = topic.toLowerCase();
  const nums = (t.match(/\d+/g)||[]).map(Number);
  const specific = nums.length===1 ? nums[0] : null;      // "7 times table"
  const hi = Math.min(Math.max(nums.length?Math.max(...nums):12, 5), 20);
  const ops = [];
  if(/times table|multipl|×|\bx\b|multiply/.test(t)) ops.push("×");
  if(/divis|divide|÷/.test(t)) ops.push("÷");
  if(/addit|\bplus\b|\bsum\b|\+|number bond/.test(t)) ops.push("+");
  if(/subtract|minus|take away|−|difference/.test(t)) ops.push("−");
  if(!ops.length) ops.push("×","+");                       // generic "maths"
  const cards=[]; const push=(p,a)=>cards.push([p,String(a)]);
  for(const op of ops){
    if(op==="×"){ if(specific){ for(let m=1;m<=12;m++) push(`${specific} × ${m}`, specific*m); }
      else { for(let a=2;a<=hi;a++) for(let m=2;m<=12;m++) push(`${a} × ${m}`, a*m); } }
    else if(op==="÷"){ if(specific){ for(let m=1;m<=12;m++) push(`${specific*m} ÷ ${specific}`, m); }
      else { for(let a=2;a<=hi;a++) for(let m=2;m<=12;m++) push(`${a*m} ÷ ${a}`, m); } }
    else if(op==="+"){ const M=Math.max(hi*2,20); for(let a=1;a<=M;a++) for(let b=a;b<=M;b++){ if(a+b<=M) push(`${a} + ${b}`, a+b); } }
    else if(op==="−"){ const M=Math.max(hi*2,20); for(let a=2;a<=M;a++) for(let b=1;b<a;b++) push(`${a} − ${b}`, a-b); }
  }
  return cards;
}
function bankSearch(topic){
  const words = topic.toLowerCase().match(/[a-zäöü]+/g)||[];
  if(!words.length) return [];
  const score = card => { const hay=(card[0]+" "+card[2].join(" ")).toLowerCase();
    return words.reduce((s,w)=> s + (card[2].includes(w)?2 : hay.includes(w)?1 : 0), 0); };
  return [...SCIENCE_BANK, ...VOCAB_BANK]
    .map(c=>[c,score(c)]).filter(x=>x[1]>0)
    .sort((a,b)=>b[1]-a[1]).map(x=>[x[0][0], x[0][1]]);
}
function bankLookup(prompt){
  const p = norm(prompt);
  const hit = [...SCIENCE_BANK, ...VOCAB_BANK].find(c=> norm(c[0])===p || norm(c[0]).includes(p) || p.includes(norm(c[0])));
  return hit ? hit[1] : null;
}
function localGenerate(topic, count, mode){
  if(mode==="answers"){
    const blanks = draft.staged.filter(s=>!s.answer||!s.answer.trim());
    let filled=0;
    blanks.forEach(b=>{ const a = solveArith(b.prompt) || bankLookup(b.prompt); if(a){ b.answer=a; filled++; } });
    return {answersFilled:filled, blanks:blanks.length};
  }
  const isMath = /math|maths|times table|multipl|divis|divide|addit|subtract|plus|minus|\bsum\b|arithmetic|×|÷|\bx\b|number bond|\+|\d\s*[-−]\s*\d/.test(topic.toLowerCase());
  let cards = isMath ? genMath(topic, count) : bankSearch(topic);
  if(!cards.length) return {cards:[]};
  shuffleInPlace(cards);
  cards = cards.slice(0, count);
  if(mode==="questions") cards = cards.map(c=>[c[0], ""]);
  return {cards: cards.map(c=>({prompt:c[0], answer:c[1], _keep:true}))};
}
function generate(){
  if(aiEngine==="api"){ return runAI(); }
  const topic = (document.getElementById("aiPrompt")?.value || aiTopic || "").trim();

  const res = localGenerate(topic, count, aiMode);
  if(aiMode==="answers"){
    render(); refreshStaged();
    const left = res.blanks - res.answersFilled;
    toast(res.blanks===0 ? "No blank cards to fill"
      : left ? `Filled ${res.answersFilled} · ${left} need the online engine or a manual answer`
      : `Filled all ${res.answersFilled} answers`);
    return;
  }
  if(!res.cards.length){
    aiError = `The on-device engine covers maths, science and vocabulary, and didn't recognise "${topic}". Try a maths drill (e.g. "8 times table", "division to 10"), a science topic (e.g. "water cycle", "solar system", "particle model"), "german" vocab, or switch the engine to Anthropic for open-ended topics.`;
    render(); return;
  }
  aiResults = res.cards;
  render();
}

async function runAI(){
  const prompt=(document.getElementById("aiPrompt")?.value||"").trim();
  const count=parseInt(document.getElementById("aiCount")?.value||"5",10);
  if(aiMode!=="answers" && !prompt){ toast("Add a topic prompt"); return; }
  aiBusy=true; aiError=""; aiResults=[]; render();

  let instruction;
  if(aiMode==="both"){
    instruction=`Generate ${count} study questions with correct answers on the topic: "${prompt}". Each answer must be short and factually correct.`;
  } else if(aiMode==="questions"){
    instruction=`Generate ${count} study questions on the topic: "${prompt}". Leave every answer as an empty string "".`;
  } else { // answers for staged
    const blanks=draft.staged.filter(s=>!s.answer||!s.answer.trim());
    if(!blanks.length){ aiBusy=false; aiError="No staged cards are missing answers. Add some questions first, or switch mode."; render(); return; }
    instruction=`For each of the following questions, provide a short correct answer. Return them in the same order with the exact same "prompt" text. Questions:\n${blanks.map((b,i)=>`${i+1}. ${b.prompt}`).join("\n")}`;
  }
  const sys=`You create clean study flashcards. Return ONLY a raw JSON array, no prose, no markdown fences. Each element is an object {"prompt": string, "answer": string}. Do not number the prompts. Keep answers concise.`;
  const user = (aiUseHistory?historyBlurb()+"\n\n":"")+instruction;

  const direct = !hasStore || !!userApiKey;   // outside Claude, or user supplied a key → call Anthropic directly
  if(direct && !userApiKey){
    aiBusy=false;
    aiError="To generate outside Claude, add your Anthropic API key in the setup panel below.";
    render(); return;
  }
  const headers = {"Content-Type":"application/json"};
  const model = direct ? (userModel||"claude-haiku-4-5-20251001") : "claude-sonnet-4-6";
  if(direct){
    headers["x-api-key"]=String(userApiKey).replace(/[^\x21-\x7e]/g,"").trim();  // strip whitespace/control chars unsafe in a header
    headers["anthropic-version"]="2023-06-01";
    headers["anthropic-dangerous-direct-browser-access"]="true";
  }

  try{
    const res=await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST", headers,
      body:JSON.stringify({model,max_tokens:1000,
        messages:[{role:"user",content:sys+"\n\n"+user}]})
    });
    if(!res.ok){
      let detail=""; try{ const e=await res.json(); detail=e?.error?.message?", "+e.error.message:""; }catch(_){}
      throw new Error("Request failed ("+res.status+")"+detail);
    }
    const data=await res.json();
    const text=(data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n");
    const arr=parseJsonArray(text);
    if(!arr.length) throw new Error("Couldn't read any cards from the response. Try rephrasing the prompt.");
    if(aiMode==="answers"){
      // merge answers back into staged blanks
      const blanks=draft.staged.filter(s=>!s.answer||!s.answer.trim());
      arr.forEach((r,i)=>{ if(blanks[i]) blanks[i].answer=r.answer||blanks[i].answer; });
      aiBusy=false; aiResults=[]; render(); refreshStaged(); toast("Answers filled in"); return;
    }
    aiResults=arr.map(r=>({prompt:String(r.prompt||"").trim(),answer:String(r.answer||"").trim(),_keep:true})).filter(r=>r.prompt);
    aiBusy=false; render();
  }catch(err){
    aiBusy=false;
    if(/Failed to fetch|NetworkError/i.test(err.message)){
      aiError = userApiKey
        ? "Couldn't reach Anthropic. If you opened this file directly, some browsers block the request from a local file, try serving it over http, or check the key."
        : "Couldn't reach the AI service. Inside Claude this just works; in a downloaded copy, add your Anthropic API key below.";
    } else {
      aiError = err.message + (/401|403/.test(err.message) ? ", check your API key." : "");
    }
    render();
  }
}
function parseJsonArray(text){
  if(!text) return [];
  let t=text.replace(/```json/gi,"").replace(/```/g,"").trim();
  const a=t.indexOf("["), b=t.lastIndexOf("]");
  if(a>-1&&b>-1) t=t.slice(a,b+1);
  try{ const p=JSON.parse(t); return Array.isArray(p)?p:[]; }catch(e){ return []; }
}

    id:"acer-hum", family:"ACER-style", name:"Humanities and Comprehension (Year 6 to 7 Entry)", year:6, minutes:40, premium:true,
    passage:"ON THE KEEPING OF MAPS\n\nEvery map is an argument. We are taught to think of them as neutral, as flat, obedient records of what is simply there, but a map cannot show everything, and so someone must choose what it shows. That choosing is never innocent.\n\nConsider the humble road map. It renders highways in confident red and omits the footpaths that a farmer has walked for thirty years. It is not lying. It has decided, quite reasonably, that its reader is in a car. But a person on foot, holding that map, lives in a country that does not appear on it.\n\nThe most famous example is the projection problem. The Earth is a sphere; paper is not. Any attempt to flatten one onto the other must stretch something. The Mercator projection, drawn in 1569 for sailors, preserves the angles a navigator needs and, in doing so, inflates the landmasses near the poles. Greenland swells to the apparent size of Africa, though Africa is in truth some fourteen times larger. Generations grew up with that distortion pinned to classroom walls, absorbing without knowing it a particular sense of which places were large and which were small.\n\nNone of this makes maps useless. It makes them human. The right response is not to distrust every map but to ask of each one the question we should ask of any account: who drew this, for whom, and what did they decide we did not need to see?",

    passage:"THE TIN CITY\n\nOut past the last fence line, where the road gives up and becomes two ruts in red dirt, there is a settlement that appears on no council register. The locals call it Tin City. Eleven huts stand in a loose crescent against the dunes, walled with corrugated iron that has weathered to the colour of dried blood.\n\nNobody planned it. In 1932 a fisherman named Doherty dragged a sheet of iron up from the wreck of a trawler and propped it against the wind. Others followed, each borrowing from the sea what the land refused to give. The huts grew the way coral grows: slowly, without instruction, each addition fitted to what was already there.\n\nThere is no power. Water arrives in drums. In summer the iron becomes too hot to touch by nine in the morning, and the residents retreat to the shaded side, moving with the sun as the day turns, the way people once moved with the seasons.\n\nHeritage officers have visited twice. Their reports use the word 'vernacular', architecture made by ordinary people, without architects, from whatever lies to hand. It is a careful word. It grants the place dignity without quite deciding whether it should be preserved or removed.\n\nThe residents themselves are unsentimental. Ask them why they stay and they will look at you as though the question is badly formed. Then they will point, usually, at the water.",
