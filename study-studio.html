/* ---- exam runner ---- */
function beginExam(id){
  const t=TESTS.find(x=>x.id===id); if(!t) return;
  const items=[];
  t.sections.forEach(sec=>{
    // Per-attempt copies so we never mutate the source TESTS.
    const secItems = sec.items.map(it=>({...it, section:sec.name, subject:it.subject||t.subject||"Maths"}));
    shuffleInPlace(secItems);                                 // shuffle question order within each section
    secItems.forEach(it=>{
      // Shuffle multiple-choice options (3+ opts) so the correct answer isn't
      // always in the same position, and remap the answer index to match.
      if(Array.isArray(it.opts) && typeof it.a==="number" && it.opts.length>=3){
        const perm = shuffleInPlace(it.opts.map((_,k)=>k));   // permutation of option indices
        it.opts = perm.map(k=>it.opts[k]);
        it.a = perm.indexOf(it.a);
      }
      items.push(it);
    });
  });
  exam = { testId:id, items, answers:new Array(items.length).fill(null), flags:new Array(items.length).fill(false),
           i:0, started:Date.now(), deadline:Date.now()+t.minutes*60000, submitted:false };
  view="exam"; render();
  startExamTimer();
}
function startExamTimer(){
  clearInterval(examTimer);
  examTimer=setInterval(()=>{
    if(!exam || exam.submitted){ clearInterval(examTimer); return; }
    const left=exam.deadline-Date.now();
    const el=document.getElementById("examClock");
    if(el){
      el.textContent=fmtTime(Math.max(0,left));
      el.className = "examclock" + (left<60000?" danger":left<300000?" warn":"");
    }
    if(left<=0){ clearInterval(examTimer); submitExam(true); }
  },250);
}
function fmtTime(ms){
  const s=Math.floor(ms/1000), m=Math.floor(s/60);
  return String(m).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
}
function examAnswer(idx){ saveWorking(); exam.answers[exam.i]=idx; sfx("click"); render(); }
function examGo(i){ saveWorking(); exam.i=Math.max(0,Math.min(exam.items.length-1,i)); render(); }
function examFlag(){ saveWorking(); exam.flags[exam.i]=!exam.flags[exam.i]; render(); }

function workFor(i){
  exam.working = exam.working || {};

function saveWorking(){

function setPen(c){ penColor=c; eraser=false; render(); }
function setPenSize(s){ penSize=+s; eraser=false; const el=document.getElementById("penSizeVal"); if(el) el.textContent=s; }
function toggleEraser(){ eraser=!eraser; render(); }
function clearCanvas(){
  const c=document.getElementById("workCanvas"); if(!c) return;
  const w=workFor(exam.i);
  try{ w.undo.push(c.toDataURL()); if(w.undo.length>12) w.undo.shift(); }catch(e){}
  const ctx=c.getContext("2d"); ctx.clearRect(0,0,c.width,c.height);

function undoCanvas(){
  const c=document.getElementById("workCanvas"); if(!c) return;
  const w=workFor(exam.i);
  if(!w.undo || !w.undo.length){ toast("Nothing to undo"); return; }
  const data=w.undo.pop();
  const ctx=c.getContext("2d"); ctx.clearRect(0,0,c.width,c.height);
  const img=new Image(); img.onload=()=>{ ctx.drawImage(img,0,0,c.width/ (window.devicePixelRatio||1), c.height/(window.devicePixelRatio||1)); w.img=c.toDataURL(); };
  img.src=data;
}
function insertWorkSym(ch){
  const t=document.getElementById("workText"); if(!t) return;
  const s=t.selectionStart??t.value.length, e=t.selectionEnd??t.value.length;
  t.value=t.value.slice(0,s)+ch+t.value.slice(e);
  const p=s+ch.length; t.focus(); try{ t.setSelectionRange(p,p); }catch(_){}
  workFor(exam.i).text=t.value;
}
function workingPanel(){

    `}

function wireWorkCanvas(){
  const c=document.getElementById("workCanvas"); if(!c) return;
  const dpr=window.devicePixelRatio||1;
  const rect=c.getBoundingClientRect();
  const cssW=rect.width||600, cssH=260;
  c.width=cssW*dpr; c.height=cssH*dpr; c.style.height=cssH+"px";
  const ctx=c.getContext("2d");
  ctx.scale(dpr,dpr);
  ctx.lineCap="round"; ctx.lineJoin="round";
  const w=workFor(exam.i);
  if(w.img){ const img=new Image(); img.onload=()=>ctx.drawImage(img,0,0,cssW,cssH); img.src=w.img; }
  let drawing=false, last=null;
  const pos=e=>{ const r=c.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; };
  const start=e=>{
    drawing=true; last=pos(e); c.setPointerCapture?.(e.pointerId);
    try{ w.undo=w.undo||[]; w.undo.push(c.toDataURL()); if(w.undo.length>12) w.undo.shift(); }catch(_){}
    e.preventDefault();
  };
  const move=e=>{
    if(!drawing) return;
    const p=pos(e);
    ctx.globalCompositeOperation = eraser ? "destination-out" : "source-over";
    ctx.strokeStyle = penColor; ctx.lineWidth = eraser ? penSize*4 : penSize;
    ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke();
    last=p; e.preventDefault();
  };
  const end=()=>{ if(!drawing) return; drawing=false; try{ w.img=c.toDataURL(); }catch(_){} };
  c.addEventListener("pointerdown",start);
  c.addEventListener("pointermove",move);
  c.addEventListener("pointerup",end);
  c.addEventListener("pointerleave",end);
  c.addEventListener("pointercancel",end);
  c.style.touchAction="none";
  // keep the drawing if the window is resized
  if(!window._workResize){
    window._workResize=true;
    let rt=null;
    window.addEventListener("resize",()=>{
      if(view!=="exam"||!exam) return;
      clearTimeout(rt);
      rt=setTimeout(()=>{ saveWorking(); wireWorkCanvas(); },220);
    });
  }
}
function examInput(it){
  const cur = exam.answers[exam.i];
  if(it.type==="text"){
    return `<input class="ans" id="examText" placeholder="Type your answer" autocomplete="off" spellcheck="false"
      value="${esc(cur==null?"":cur)}" oninput="exam.answers[exam.i]=this.value">
      ${symbolBar("examText", it.subject||"Maths")}`;
  }
  if(it.type==="order"){
    const order = Array.isArray(cur) && cur.length===it.order.length ? cur : (exam._shuffled&&exam._shuffled[exam.i]) || null;
    if(!order){
      exam._shuffled = exam._shuffled || {};
      exam._shuffled[exam.i] = shuffleInPlace(it.order.slice());
    }
    const items = Array.isArray(cur) ? cur : exam._shuffled[exam.i];
    return `<div class="orderhint">Drag the boxes into the right order, or use the arrows.</div>
      <div class="orderlist" id="orderList">
        ${items.map((t,oi)=>`<div class="orderbox" draggable="true" data-idx="${oi}">
          <span class="ordergrip">⠿</span><span class="ordernum">${oi+1}</span>
          <span class="ordertext">${esc(t)}</span>
          <span class="orderarrows">
            <button onclick="moveOrder(${oi},-1)" ${oi===0?"disabled":""}>▲</button>
            <button onclick="moveOrder(${oi},1)" ${oi===items.length-1?"disabled":""}>▼</button>
          </span></div>`).join("")}
      </div>`;
  }
  return `<div class="opts-list">
    ${it.opts.map((o,oi)=>`<button class="optrow ${cur===oi?"on":""}" onclick="examAnswer(${oi})">
      <span class="optletter">${String.fromCharCode(65+oi)}</span>${esc(o)}</button>`).join("")}
  </div>`;
}
function currentOrder(){
  const it=exam.items[exam.i];
  const cur=exam.answers[exam.i];
  if(Array.isArray(cur)) return cur.slice();
  exam._shuffled = exam._shuffled || {};
  if(!exam._shuffled[exam.i]) exam._shuffled[exam.i]=shuffleInPlace(it.order.slice());
  return exam._shuffled[exam.i].slice();
}
function moveOrder(i, dir){
  const arr=currentOrder();
  const j=i+dir; if(j<0||j>=arr.length) return;
  [arr[i],arr[j]]=[arr[j],arr[i]];
  exam.answers[exam.i]=arr; sfx("click"); render();
}
function wireOrderDrag(){
  const list=document.getElementById("orderList"); if(!list) return;
  let dragIdx=null;
  list.querySelectorAll(".orderbox").forEach(box=>{
    box.addEventListener("dragstart",e=>{ dragIdx=+box.dataset.idx; box.classList.add("dragging"); });
    box.addEventListener("dragend",()=>{ box.classList.remove("dragging"); dragIdx=null; });
    box.addEventListener("dragover",e=>{ e.preventDefault(); box.classList.add("over"); });
    box.addEventListener("dragleave",()=>box.classList.remove("over"));
    box.addEventListener("drop",e=>{
      e.preventDefault(); box.classList.remove("over");
      const to=+box.dataset.idx;
      if(dragIdx===null||dragIdx===to) return;
      const arr=currentOrder();
      const [moved]=arr.splice(dragIdx,1); arr.splice(to,0,moved);
      exam.answers[exam.i]=arr; sfx("click"); render();
    });
    // touch support
    let startY=null;
    box.addEventListener("pointerdown",e=>{ if(e.pointerType==="mouse") return; startY=e.clientY; });
    box.addEventListener("pointerup",e=>{
      if(e.pointerType==="mouse"||startY===null) return;
      const dy=e.clientY-startY; startY=null;
      if(Math.abs(dy)<24) return;
      moveOrder(+box.dataset.idx, dy>0?1:-1);
    });
  });
}

function abandonExam(){
  if(!confirm("Abandon this test? Your answers won't be saved.")) return;
  clearInterval(examTimer); exam=null; go("tests");
}
function itemCorrect(it, ans){
  if(it.type==="text"){ return ans!=null && gradeAnswer(String(ans), it.ans, it.alt)==="right"; }
  if(it.type==="order"){ return Array.isArray(ans) && ans.length===it.order.length && ans.every((v,k)=>v===it.order[k]); }
  return ans===it.a;
}
function submitExam(auto){
  if(!exam || exam.submitted) return;
  saveWorking();
  if(!auto){
    const blank=exam.answers.filter(a=>a===null||a==="").length;
    const msg = blank ? `Submit with ${blank} question${blank!==1?"s":""} unanswered?` : "Submit your paper?";
    if(!confirm(msg)) return;
  }
  clearInterval(examTimer);
  exam.submitted=true;
  const t=TESTS.find(x=>x.id===exam.testId);
  let correct=0; const perSection={};
  exam.items.forEach((it,i)=>{
    const ok = itemCorrect(it, exam.answers[i]);
    if(ok) correct++;
    const s=perSection[it.section]=perSection[it.section]||{c:0,n:0};
    s.n++; if(ok) s.c++;
  });
  const pct=Math.round(correct/exam.items.length*100);
  const attempt={ id:uid(), testId:exam.testId, date:Date.now(), correct, total:exam.items.length, pct,
    seconds:Math.round((Date.now()-exam.started)/1000), autoSubmitted:!!auto,
    sections:Object.entries(perSection).map(([k,v])=>({name:k, correct:v.c, total:v.n})),
    answers:exam.answers.slice(), items:exam.items };   // keep the shuffled items so review lines up
  S.testAttempts=S.testAttempts||[]; S.testAttempts.push(attempt);
  save(); if(profile.email) touchRegistry(profile.email);
  examReview=attempt; exam=null; view="testresult"; render();   // release working-canvas memory; review runs off examReview
  celebrate(pct);
}

/* ---- results ---- */
function bandFor(family, pct){
  const kind=TEST_FAMILIES[family].bands;
  if(kind==="proficiency"){
    if(pct>=85) return {label:"Exceeding", col:"var(--good)", i:3};
    if(pct>=65) return {label:"Strong", col:"var(--good)", i:2};
    if(pct>=45) return {label:"Developing", col:"var(--amber)", i:1};
    return {label:"Needs additional support", col:"var(--bad)", i:0};
  }
  if(kind==="award"){
    if(pct>=90) return {label:"High Distinction range", col:"var(--good)", i:4};
    if(pct>=80) return {label:"Distinction range", col:"var(--good)", i:3};
    if(pct>=65) return {label:"Credit range", col:"var(--amber)", i:2};
    if(pct>=50) return {label:"Merit range", col:"var(--amber)", i:1};
    return {label:"Participation range", col:"var(--muted)", i:0};
  }
  if(pct>=85) return {label:"Scholarship-competitive", col:"var(--good)", i:3};
  if(pct>=70) return {label:"Strong", col:"var(--good)", i:2};
  if(pct>=55) return {label:"Developing", col:"var(--amber)", i:1};
  return {label:"Needs work", col:"var(--bad)", i:0};
}

  const delta=prev.length ? a.pct - prev[prev.length-1].pct : null;
  return `

function benchmarkChart(series, family){
  const W=640,H=280,pad={l:44,r:16,t:18,b:38};
  const iw=W-pad.l-pad.r, ih=H-pad.t-pad.b;
  const n=series.length;
  const xFor=i=> n===1 ? pad.l+iw/2 : pad.l+(i/(n-1))*iw;
  const yFor=v=> pad.t+(1-v/100)*ih;
  // benchmark bands
  let bands=[];
  if(family && TEST_FAMILIES[family]){
    const kind=TEST_FAMILIES[family].bands;
    if(kind==="proficiency") bands=[[0,45,"#fdeff0"],[45,65,"#fdf3e0"],[65,85,"#e2f4ee"],[85,100,"#d3efe4"]];
    else if(kind==="award")  bands=[[0,50,"#f2f3f7"],[50,65,"#fdf3e0"],[65,80,"#fdf8e6"],[80,90,"#e2f4ee"],[90,100,"#d3efe4"]];
    else bands=[[0,55,"#fdeff0"],[55,70,"#fdf3e0"],[70,85,"#e2f4ee"],[85,100,"#d3efe4"]];
  }
  const bandSvg=bands.map(([lo,hi,col])=>`<rect x="${pad.l}" y="${yFor(hi)}" width="${iw}" height="${yFor(lo)-yFor(hi)}" fill="${col}"/>`).join("");
  const grid=[0,25,50,75,100].map(v=>`<line x1="${pad.l}" y1="${yFor(v)}" x2="${W-pad.r}" y2="${yFor(v)}" stroke="var(--line)"/>
    <text x="${pad.l-8}" y="${yFor(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="Space Mono,monospace">${v}</text>`).join("");
  const pts=series.map((a,i)=>[xFor(i),yFor(a.pct)]);
  const line=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const dots=pts.map((p,i)=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="5" fill="#fff" stroke="var(--accent)" stroke-width="2.5"/>
    <text x="${p[0].toFixed(1)}" y="${(p[1]-13).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--accent)" font-family="Space Mono,monospace">${series[i].pct}%</text>`).join("");
  const xlab=series.map((a,i)=>{ const d=new Date(a.date);
    return `<text x="${xFor(i).toFixed(1)}" y="${H-10}" text-anchor="middle" font-size="10.5" fill="var(--muted)">${d.getDate()}/${d.getMonth()+1}</text>`; }).join("");
  return `<svg width="100%" viewBox="0 0 ${W} ${H}" style="max-width:100%;overflow:visible">
    ${bandSvg}${grid}
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    ${dots}${xlab}</svg>`;
}
function benchmarkPanel(t, attempts){
  const latest=attempts[attempts.length-1];
  const band=bandFor(t.family, latest.pct);
  const kind=TEST_FAMILIES[t.family].bands;
  const scale = kind==="proficiency"
    ? [["Needs additional support","0-44%"],["Developing","45-64%"],["Strong","65-84%"],["Exceeding","85-100%"]]
    : kind==="award"
    ? [["Participation range","0-49%"],["Merit range","50-64%"],["Credit range","65-79%"],["Distinction range","80-89%"],["High Distinction range","90-100%"]]
    : [["Needs work","0-54%"],["Developing","55-69%"],["Strong","70-84%"],["Scholarship-competitive","85-100%"]];
  // section strengths across attempts
  const secAgg={};
  attempts.forEach(a=>a.sections.forEach(s=>{ const g=secAgg[s.name]=secAgg[s.name]||{c:0,n:0}; g.c+=s.correct; g.n+=s.total; }));
  return `<div class="panel" style="margin-top:18px">
    <h2>Where this sits</h2>
    <div class="sub">Your most recent result: <b style="color:${pctColor(latest.pct)}">${latest.pct}%</b>, ${esc(band.label)}</div>
    <div class="scalebars">
      ${scale.map((row,i)=>`<div class="scalerow ${i===band.i?"cur":""}">
        <span class="scalename">${esc(row[0])}</span><span class="scalerange mono">${row[1]}</span>
        ${i===band.i?'<span class="scaleyou">you</span>':""}</div>`).join("")}
    </div>
    ${Object.keys(secAgg).length>1?`<h2 style="margin-top:20px">Section strengths</h2>
      <div class="secbreak">${Object.entries(secAgg).map(([k,v])=>{
        const p=Math.round(v.c/v.n*100);
        return `<div class="secrow"><span>${esc(k)}</span><span class="secbar"><i style="width:${p}%;background:${pctColor(p)}"></i></span><span class="mono" style="color:${pctColor(p)}">${p}%</span></div>`;
      }).join("")}</div>`:""}
    <p class="note" style="margin-top:14px">${esc(TEST_FAMILIES[t.family].note)}</p>
  </div>`;
}
function familyPanel(byTest){

      </div>`;
    }).join("")}
  </div>`;
}

/* ============================ CROSS PLATFORM CONNECTIVITY ============================
   A hub for everything due across your learning platforms.
   Deliberately does NOT ask for platform passwords. See connectNote() for why.       */
/* ---- Google Classroom sync (browser only OAuth, no password ever enters this app) ----
   Set up once: Google Cloud Console > new project > APIs & Services
     1. Enable "Google Classroom API"
     2. Credentials > Create OAuth client ID > Web application
     3. Authorised JavaScript origins: your site address (e.g. https://yoursite.netlify.app)
     4. Paste the Client ID below. It is public by design, not a secret.                */
const CLASSROOM_CLIENT_ID = "";   // e.g. "1234567890-abcdefg.apps.googleusercontent.com"

let gcToken = null, gcBusy = false, gcError = "";
function gcConfigured(){ return !!(CLASSROOM_CLIENT_ID || (S.gcClientId||"")).trim(); }
function gcClientId(){ return (CLASSROOM_CLIENT_ID || (S.gcClientId||"")).trim(); }
function saveGcId(v){ S.gcClientId=(v||"").trim(); save(); }
function loadGsi(){
  return new Promise((res,rej)=>{
    if(window.google && window.google.accounts && window.google.accounts.oauth2) return res();
    const s=document.createElement("script");
    s.src="https://accounts.google.com/gsi/client"; s.async=true;
    s.onload=()=>res();
    s.onerror=()=>rej(new Error("Could not load Google sign in. Check your internet connection."));
    document.head.appendChild(s);
  });
}
async function connectClassroom(){
  gcError="";
  if(!gcConfigured()){ connectTab="platforms"; toast("Add your Google Client ID first"); render(); return; }
  gcBusy=true; render();
  try{
    await loadGsi();
    const tc = google.accounts.oauth2.initTokenClient({
      client_id: gcClientId(),
      scope: "https://www.googleapis.com/auth/classroom.courses.readonly https://www.googleapis.com/auth/classroom.coursework.me.readonly",
      callback: async (resp)=>{
        if(resp && resp.access_token){ gcToken=resp.access_token; await syncClassroom(); }
        else { gcBusy=false; gcError="Google did not return permission."; render(); }
      },
      error_callback: (e)=>{ gcBusy=false; gcError="Sign in was cancelled or blocked."; render(); }
    });
    tc.requestAccessToken();
  }catch(err){ gcBusy=false; gcError=err.message; render(); }
}
async function gcFetch(path){
  const r=await fetch("https://classroom.googleapis.com/v1/"+path,{headers:{Authorization:"Bearer "+gcToken}});
  if(r.status===401||r.status===403){ throw new Error("Google refused access. Many school accounts block outside apps, which your school controls."); }
  if(!r.ok) throw new Error("Classroom replied with an error ("+r.status+")");
  return r.json();
}
function gcDue(w){
  if(!w.dueDate) return "";
  const d=w.dueDate;
  return d.year+"-"+String(d.month).padStart(2,"0")+"-"+String(d.day).padStart(2,"0");
}
async function syncClassroom(){
  try{
    const courses=(await gcFetch("courses?courseStates=ACTIVE&pageSize=50")).courses||[];
    let added=0, updated=0;
    for(const c of courses){
      let work=[];
      try{ work=(await gcFetch("courses/"+c.id+"/courseWork?pageSize=60")).courseWork||[]; }catch(e){ continue; }
      let subs={};
      try{
        const sr=await gcFetch("courses/"+c.id+"/courseWork/-/studentSubmissions?userId=me&pageSize=200");
        (sr.studentSubmissions||[]).forEach(s=>{ subs[s.courseWorkId]=s.state; });
      }catch(e){}
      for(const w of work){
        const state=subs[w.id];
        const done = state==="TURNED_IN" || state==="RETURNED";
        const existing=assignments().find(a=>a.gcId===w.id);
        if(existing){
          existing.title=w.title||existing.title;
          existing.due=gcDue(w)||existing.due;
          existing.subject=c.name||existing.subject;
          if(done && existing.status!=="done"){ existing.status="done"; }
          existing.updated=Date.now(); updated++;
        } else {
          assignments().push({ id:uid(), gcId:w.id, source:"classroom",
            title:w.title||"Classroom task", platform:"classroom",
            subject:c.name||"", due:gcDue(w), url:w.alternateLink||"",
            status:done?"done":"todo", urgency:0, created:Date.now(), updated:Date.now() });
          added++;
        }
      }
    }
    S.gcLastSync=Date.now();
    gcBusy=false; save(); sfx("create");
    toast(added?("Brought in "+added+" task"+(added!==1?"s":"")):"Your list is already up to date");
    connectTab="due"; render();
  }catch(err){ gcBusy=false; gcError=err.message; render(); }
}
function disconnectClassroom(){
  if(!confirm("Disconnect Google Classroom? Tasks it added stay on your list.")) return;
  gcToken=null; S.gcLastSync=null;
  assignments().forEach(a=>{ if(a.source==="classroom") a.source="manual"; });
  save(); toast("Disconnected"); render();
}

  const a=assignments().find(x=>x.id===id); if(!a) return;

/* lower score sorts first: each urgency step counts as three days closer */
function sortScore(a){
  const n=dayDiff(a.due);
  const base = n===null ? 999 : n;
  return base - (a.urgency||0)*3;
}

  {id:"seesaw",    name:"Seesaw", icon:"🌱", url:"https://app.seesaw.me/#/student/home", host:"seesaw.me", tint:"#e7f7ea", ink:"#217a3c"},
  {id:"canvas",    name:"Canvas", icon:"🎨", url:"https://canvas.instructure.com/", host:"instructure.com", tint:"#fdeef4", ink:"#b0246b"},

  {id:"other",     name:"Other site", icon:"🔗", url:"", host:"", tint:"#eef0f5", ink:"#4a5578"}

function plat(id){ return PLATFORMS.find(p=>p.id===id) || PLATFORMS[PLATFORMS.length-1]; }
function platFromUrl(u){
  const s=(u||"").toLowerCase();
  const hit=PLATFORMS.find(p=>p.host && s.includes(p.host));
  return hit ? hit.id : "other";
}

/* ---- assignment data ---- */
function assignments(){ S.assignments = S.assignments || []; return S.assignments; }
function trackedPlatforms(){ S.tracked = S.tracked || ["classroom","eperfect","mathspace"]; return S.tracked; }
function toggleTracked(id){
  const t=trackedPlatforms(); const i=t.indexOf(id);
  if(i>-1) t.splice(i,1); else t.push(id);
  save(); sfx("click"); render();
}
function dayDiff(dateStr){
  if(!dateStr) return null;
  const d=new Date(dateStr+"T23:59:59"); if(isNaN(d)) return null;
  const now=new Date(); now.setHours(0,0,0,0);
  const t=new Date(d); t.setHours(0,0,0,0);
  return Math.round((t-now)/86400000);
}
function dueLabel(dateStr){
  const n=dayDiff(dateStr);
  if(n===null) return {text:"No due date", cls:"none"};
  if(n<0)  return {text:(-n)+" day"+(-n!==1?"s":"")+" overdue", cls:"over"};
  if(n===0) return {text:"Due today", cls:"soon"};
  if(n===1) return {text:"Due tomorrow", cls:"soon"};
  if(n<=7) return {text:"Due in "+n+" days", cls:"week"};
  const d=new Date(dateStr+"T00:00:00");
  return {text:"Due "+d.getDate()+"/"+(d.getMonth()+1), cls:"later"};
}
function addAssignment(){
  const title=(document.getElementById("asgTitle")?.value||"").trim();
  if(!title){ toast("Give the task a name"); return; }
  const url=(document.getElementById("asgUrl")?.value||"").trim();
  let pid=document.getElementById("asgPlat")?.value||"other";
  if(url && pid==="auto") pid=platFromUrl(url);
  const a={ id:uid(), title, platform:pid==="auto"?platFromUrl(url):pid,
    subject:(document.getElementById("asgSubj")?.value||"").trim(),
    due:document.getElementById("asgDue")?.value||"",
    url, status:"todo", urgency:0, source:"manual", created:Date.now(), updated:Date.now() };
  assignments().push(a);
  save(); sfx("create"); toast("Task added");
  ["asgTitle","asgUrl","asgSubj","asgDue"].forEach(id=>{ const el=document.getElementById(id); if(el) el.value=""; });
  render();
}
function setStatus(id, status){
  const a=assignments().find(x=>x.id===id); if(!a) return;
  a.status=status; a.updated=Date.now();
  save(); sfx(status==="done"?"correct":"click"); render();
}
function deleteAssignment(id){
  const a=assignments().find(x=>x.id===id); if(!a) return;
  if(!confirm("Remove \""+a.title+"\" from your list?")) return;
  S.assignments=assignments().filter(x=>x.id!==id);
  save(); render();
}
function openPlatform(url, pid){
  const target = url && /^https?:\/\//i.test(url) ? url : plat(pid).url;
  if(!target){ toast("No link saved for this task"); return; }
  window.open(target, "_blank", "noopener");
}

/* ---- views ---- */
let connectTab = "due";     // "due" | "platforms" | "add"
function viewConnect(){
  const list=assignments();
  const open=list.filter(a=>a.status!=="done");
  const overdue=open.filter(a=>{ const n=dayDiff(a.due); return n!==null && n<0; }).length;
  const soon=open.filter(a=>{ const n=dayDiff(a.due); return n!==null && n>=0 && n<=1; }).length;
  const tabs=`<div class="subtabs" style="margin-bottom:18px">
    <button class="subtab ${connectTab==='due'?'on':''}" onclick="connectTab='due';render()">📋 What is due</button>
    <button class="subtab ${connectTab==='platforms'?'on':''}" onclick="connectTab='platforms';render()">🔗 My platforms</button>
    <button class="subtab ${connectTab==='add'?'on':''}" onclick="connectTab='add';render()">➕ Add a task</button>
  </div>`;
  const head=`<div class="head"><div class="eyebrow">Cross platform</div>
    <h1>All your work in one place</h1>
    <p>Everything due across your learning sites, closest first. Click any task to jump straight to it.</p></div>
    <div class="strip">
      <div class="stat"><div class="k">Still to do</div><div class="v">${open.length}</div></div>
      <div class="stat"><div class="k">Overdue</div><div class="v" style="color:${overdue?"var(--bad)":"var(--muted)"}">${overdue}</div></div>
      <div class="stat"><div class="k">Due today or tomorrow</div><div class="v" style="color:${soon?"var(--amber)":"var(--muted)"}">${soon}</div></div>
    </div>${tabs}`;
  const ed = editingAsg ? assignments().find(a=>a.id===editingAsg) : null;
  const modal = ed ? asgEditPanel(ed) : "";
  if(connectTab==="platforms") return head + platformsPanel() + connectNote() + modal;
  if(connectTab==="add") return head + addPanel() + connectNote() + modal;
  return head + duePanel() + connectNote() + modal;
}
function duePanel(){
  const list=assignments();
  if(!list.length){
    return `<div class="empty"><h3>Nothing on your list yet</h3>
      <p>Add the tasks you have been set and they will line up here, closest due date first.</p>
      <button class="btn" onclick="connectTab='add';render()">Add your first task</button></div>`;
  }
  const open=list.filter(a=>a.status!=="done").sort((a,b)=>sortScore(a)-sortScore(b));
  const recent=list.slice().sort((a,b)=>b.updated-a.updated).slice(0,6);
  return `
  ${open.length?`<div class="asglist">${open.map(asgRow).join("")}</div>`
    :`<div class="empty"><h3>All caught up</h3><p>Nothing outstanding. Nice work.</p></div>`}
  <div class="panel" style="margin-top:22px">
    <h2>Recently changed</h2>
    <div class="sub">The last few tasks you added, ticked off or updated.</div>
    <div class="asglist">${recent.map(a=>asgRow(a,true)).join("")}</div>
  </div>`;
}
function asgRow(a, compact){
  const p=plat(a.platform), d=dueLabel(a.due);
  const done=a.status==="done";
  const u=URGENCY[a.urgency||0];
  return `<div class="asgrow ${done?"done":""} ${d.cls} urg${a.urgency||0}">
    <span class="asgplat" style="background:${p.tint};color:${p.ink}" title="${esc(p.name)}">${p.icon}</span>
    <div class="asgmain">
      <button class="asgtitle" onclick="openAsgEdit('${a.id}')" title="Click to edit">${esc(a.title)}</button>
      <div class="asgmeta">${esc(p.name)}${a.subject?" · "+esc(a.subject):""}${a.source==="classroom"?' · <span class="gcflag">synced</span>':""}${(a.urgency||0)>0?` · <b style="color:${u.col}">${u.label}</b>`:""}${compact?" · "+relTime(a.updated):""}</div>
    </div>
    <span class="asgdue ${d.cls}">${esc(d.text)}</span>
    <div class="asgacts">
      <button class="asgopen" onclick="openPlatform('${esc(a.url||"")}','${a.platform}')" title="Open the site">↗</button>
      ${done
        ? `<button class="btn ghost sm" onclick="setStatus('${a.id}','todo')">Undo</button>`
        : `<button class="btn good sm" onclick="setStatus('${a.id}','done')">Done</button>`}
      <button class="asgx" aria-label="Remove assignment" onclick="deleteAssignment('${a.id}')" title="Remove">✕</button>
    </div>
  </div>`;
}
function platformsPanel(){
  const tracked=trackedPlatforms();
  const synced=S.gcLastSync;
  const gcCard=`<div class="panel" style="margin-bottom:18px">
    <h2>🎓 Google Classroom sync</h2>
    <div class="sub">Bring your Classroom tasks in automatically, with their due dates.</div>
    ${gcBusy?loadingBox("Talking to Google Classroom"):`
      <div class="row" style="margin-bottom:6px">
        <button class="btn good" onclick="connectClassroom()">${synced?"Sync again":"Connect Google Classroom"}</button>
        ${synced?`<button class="btn ghost" onclick="disconnectClassroom()">Disconnect</button>`:""}
      </div>
      ${synced?`<div class="note">Last brought in ${relTime(synced)}.</div>`:""}
    `}
    ${gcError?`<div class="errbox">${esc(gcError)}</div>`:""}
    ${!gcConfigured()?`
      <details class="aikey" style="margin-top:12px" open>
        <summary>Set this up once</summary>
        <div class="note" style="margin:8px 0 12px">
          Google needs to know about your site before it will share anything. In the
          <b>Google Cloud Console</b>: create a project, turn on the <b>Google Classroom API</b>, then under
          <b>Credentials</b> make an <b>OAuth client ID</b> of type <b>Web application</b>. Put your site address
          in "Authorised JavaScript origins". Copy the Client ID it gives you and paste it below.
          The Client ID is meant to be public, so it is safe to store.
        </div>
        <div class="field"><label>Google Client ID</label>
          <input id="gcId" value="${esc(S.gcClientId||"")}" placeholder="1234567890-abcdefg.apps.googleusercontent.com"
            oninput="saveGcId(this.value)"></div>

    <div class="note" style="margin-top:10px">

  </div>`;
  return gcCard + `<div class="grid">

        <div class="top"><h3><span class="asgplat" style="background:${p.tint};color:${p.ink}">${p.icon}</span> ${esc(p.name)}</h3></div>
        <div class="meta"><span>${count} open task${count!==1?"s":""}</span></div>
        <div class="row">
          <button class="btn sm" onclick="window.open('${p.url}','_blank','noopener')">Open site</button>

function addPanel(){
  const tracked=trackedPlatforms();
  const opts=PLATFORMS.filter(p=>tracked.includes(p.id)||p.id==="other");
  return `<div class="panel">
    <h2>Add a task</h2>
    <div class="sub">Put in what you have been set. Paste the link and the site is worked out for you.</div>
    <div class="field"><label>What is the task?</label>
      <input id="asgTitle" placeholder="For example: Fractions review, questions 1 to 12"></div>
    <div class="two">
      <div class="field"><label>Which site?</label>
        <select id="asgPlat">
          <option value="auto">Work it out from the link</option>
          ${opts.map(p=>`<option value="${p.id}">${p.icon} ${esc(p.name)}</option>`).join("")}
        </select></div>
      <div class="field"><label>Due date</label><input id="asgDue" type="date"></div>
    </div>
    <div class="two">
      <div class="field"><label>Subject <span style="color:var(--muted);font-weight:400">(optional)</span></label>
        <input id="asgSubj" placeholder="Maths"></div>
      <div class="field"><label>Direct link <span style="color:var(--muted);font-weight:400">(optional)</span></label>
        <input id="asgUrl" placeholder="Paste the task link here"></div>
    </div>
    <button class="btn good" onclick="addAssignment()">Add to my list</button>
  </div>`;
}
function connectNote(){
  return `<div class="disclaimer" style="margin-top:20px">
    🔒 <b>Why this does not ask for your passwords.</b>
    Efficiency Education will never ask for your Google, Education Perfect, Mathspace or school login.
    No website should ask you to type a password that belongs to a different site, and a page like this one
    has nowhere safe to keep it. Your logins stay with the sites they belong to.
    <br><br>
    <b>Want it to fill in by itself?</b> Automatic syncing is possible for Google Classroom, but it needs a
    proper secure connection called OAuth, where Google asks your permission on its own sign in page and never
    shares your password. That needs a small server behind this app. Until then, adding tasks by hand takes a
    few seconds and keeps every account safe.
  </div>`;
}

/* ============================ nav ============================ */
function go(v,arg){
  if(v==="create" && !arg) resetDraft();   // fresh create, drop any lingering edit state
  view=v;
  if(v==="progress" && arg) progSel=arg;
  render();
}
function confirmLeaveSet(){
  if(view!=="player" || !play || play.phase==="done") return true;
  if((play.answered||0) < 2) return true;
  return confirm("Are you sure you want to leave this set?\n\nYou have answered "+play.answered+" question"+(play.answered!==1?"s":"")+". Leaving now means this session will not be saved.");
}
document.getElementById("nav").addEventListener("click",e=>{
  const b=e.target.closest("button[data-view]"); if(!b) return;
  if(view==="exam" && exam && !exam.submitted){
    if(!confirm("Leave the test? Your answers will not be saved.")) return;
    clearInterval(examTimer); exam=null;
  }
  if(!confirmLeaveSet()) return;
  if(view==="player") play=null;
  if(b.dataset.view==="create") resetDraft();
  view=b.dataset.view; render();
});

/* ============================ boot ============================ */
function localStorageWorks(){
  try{ const k="__ss_test__"; localStorage.setItem(k,"1"); localStorage.removeItem(k); return true; }catch(e){ return false; }
}
const UI_KEY="study_studio_ui";
let uiSideW=240;
async function loadUI(){
  const r=await baseGet(UI_KEY);
  if(r){ try{ const u=JSON.parse(r); if(u.sideW){ uiSideW=u.sideW; document.querySelector(".app").style.setProperty("--side-w", u.sideW+"px"); } if(u.soundOn===false) soundOn=false; }catch(e){} }
}
function saveUI(){ baseSet(UI_KEY, JSON.stringify({sideW:uiSideW, soundOn})); }
function toggleSound(){ soundOn=!soundOn; if(soundOn) sfx("ping"); saveUI(); render(); }
function setupSidebarResize(){
  const app=document.querySelector(".app"), handle=document.getElementById("sideResize");
  if(!handle) return;
  let dragging=false;
  const onMove=e=>{ if(!dragging) return; const w=Math.min(420,Math.max(170, e.clientX)); app.style.setProperty("--side-w", w+"px"); };
  const stop=()=>{ if(!dragging) return; dragging=false; handle.classList.remove("dragging"); document.body.style.userSelect="";
    uiSideW=parseInt(getComputedStyle(app).getPropertyValue("--side-w"))||240; saveUI(); };
  handle.addEventListener("mousedown", e=>{ dragging=true; handle.classList.add("dragging"); document.body.style.userSelect="none"; e.preventDefault(); });
  window.addEventListener("mousemove", onMove);
  window.addEventListener("mouseup", stop);
  // subtle click sound on menu-type controls
  document.addEventListener("click", e=>{
    const b=e.target.closest(".nav button, .subtab, .folder, .opt, .segs button, .pf-link, .crumb button, .radio");
    if(b) sfx("click");
  }, true);
}

/* ---- keep-focus popup: fires on losing window focus OR tab visibility ---- */
let awaySince=null, focusTimer=null;
const FOCUS_THRESHOLD_MS = 60000;   // must be away a full minute before prompting
const FOCUS_AUTOCLOSE_MS = 5000;    // popup dismisses itself after 5 seconds
function fmtAway(ms){
  const s=Math.round(ms/1000);
  if(s<60) return s+" second"+(s!==1?"s":"");
  const m=Math.floor(s/60), r=s%60;
  return m+" minute"+(m!==1?"s":"") + (r ? " "+r+" second"+(r!==1?"s":"") : "");
}
function showFocusPop(ms){
  const el=document.getElementById("focusPop"); if(!el) return;
  el.innerHTML=`<div class="focusbg"><div class="focuscard">
    <div class="focusemoji">🎯</div>
    <h2 style="font-size:22px;margin:6px 0 4px">Eyes back on the prize</h2>
    <p style="color:var(--muted);font-size:14px;margin:0 0 18px">You were away for ${fmtAway(ms)}. Stay focused. Every question counts!</p>
    <button class="btn wide" onclick="closeFocusPop()">Back to studying</button>
    <div class="focusbar"><i></i></div>
  </div></div>`;
  sfx("ping");
  clearTimeout(focusTimer);
  focusTimer=setTimeout(closeFocusPop, FOCUS_AUTOCLOSE_MS);
}
function closeFocusPop(){ clearTimeout(focusTimer); const el=document.getElementById("focusPop"); if(el) el.innerHTML=""; }
function markAway(){
  if(view==="auth" || awaySince) return;        // already counting, or on the sign-in screen
  awaySince=Date.now();
  document.title="👀 Come back and study, "+APP_NAME;
}
function markBack(){
  document.title=APP_NAME;
  verifyPremium({});          // cheap, self-throttling: catches a renewal/cancellation while they were away
  if(!awaySince) return;
  const gone=Date.now()-awaySince;
  awaySince=null;
  if(view!=="auth" && gone>=FOCUS_THRESHOLD_MS) showFocusPop(gone);
}
function setupFocusGuard(){
  document.addEventListener("visibilitychange", ()=>{ document.hidden ? markAway() : markBack(); });
  window.addEventListener("blur", markAway);    // clicked into another window, even while still visible
  window.addEventListener("focus", markBack);
  // guests don't persist: warn before a refresh/close would wipe their session work
  window.addEventListener("beforeunload", (e)=>{
    const worked = S && ((S.attempts&&S.attempts.length) || (S.testAttempts&&S.testAttempts.length));
    if(profile && profile.guest && worked){ e.preventDefault(); e.returnValue=""; }
  });
}

(async function boot(){
  showSplash("Getting your work ready");
  loadAiConfig(); await loadUI(); await loadPay(); setupSidebarResize(); setupFocusGuard();
  pendingUpgrade = /[?&#](upgrade=1|upgraded=1|premium=success)/i.test(location.search + location.hash);
  const sess = await baseGet(SESSION_KEY);
  if(sess){
    try{ const s=JSON.parse(sess);
      if(s.email && isAdmin(s.email)){ authEmailPending=s.email; const st=await adminStatus(); authStep=(st&&st.isSet)?"adminEnter":"adminSet"; view="auth"; render(); hideSplash(); return; }
      if(s.email){ await signIn(s.email); return; }
    }catch(e){}
  }
  showAuth();
  hideSplash();
  if(!hasStore && !localStorageWorks()){
    toast("Note: this browser blocks storage, so signing in will not save either");
  }
})();
</script>
